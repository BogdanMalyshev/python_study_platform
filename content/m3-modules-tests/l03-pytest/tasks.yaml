  options:
    - "Обидва тести зелені: фікстура викликається заново для кожного тесту"
    - "`test_add_button` зелений, `test_form_starts_empty` червоний; окремо через `-k starts` другий зелений"
    - "Обидва червоні: `scope=\"module\"` забороняє змінювати значення фікстури"
    - "`ERROR` при збиранні: фікстура з `scope=\"module\"` не може повертати мутабельне значення"
  answer: 1
  explain: |
    `scope="module"` означає один виклик фікстури на файл, і обидва тести отримують той самий словник.
    Перший додає кнопку, другий бачить її, тож `[{'type': 'button'}] == []` падає. Запущений сам через
    `-k starts`, другий тест зелений: падіння залежить від порядку, і саме тому мутабельні дані тримають
    у фікстурах з `scope="function"` (за замовчуванням). Перший варіант описує поведінку за замовчуванням,
    яка тут вимкнена. pytest нічого не забороняє змінювати й не перевіряє мутабельність, тому третій і
    четвертий варіанти вигадані; це та сама пастка, що `beforeAll` зі спільним об'єктом у Jest.

- id: q2
  type: quiz
  question: |
    Функція кидає `ValueError("visible_if references unknown field 'phone' (in step 2)")`. Який з тестів
    упаде?
    ```python
    def test_a():
        with pytest.raises(ValueError, match="unknown field"):
            check_ref("phone")


    def test_b():
        with pytest.raises(ValueError, match="'phone' (in step 2)"):
            check_ref("phone")


    def test_c():
        with pytest.raises(ValueError, match=re.escape("'phone' (in step 2)")):
            check_ref("phone")
    ```
  options:
    - "`test_a`: `match` вимагає збігу з усім повідомленням"
    - "`test_b`: дужки в `match` це група регулярного виразу, і шукається текст без дужок"
    - "`test_c`: після `re.escape` у шаблоні з'являються зворотні слеші, яких немає в повідомленні"
    - "Жоден: `match` шукає підрядок, як `toThrow(\"text\")` у Jest"
  answer: 1
  explain: |
    `match` це регулярний вираз, який pytest шукає через `re.search`. Тому `test_a` проходить: підрядку
    достатньо, повного збігу не треба. У `test_b` `(in step 2)` це група, яка збігається з `in step 2`
    без дужок, а в повідомленні дужки є, тож pytest пише "Regex pattern did not match". `re.escape`
    екранує дужки й пробіли, і слеші з'являються лише в шаблоні, а не в тексті, який шукається, тож
    `test_c` зелений. Останній варіант це інтуїція з Jest, де рядок у `toThrow` справді підрядок.

- id: q3
  type: quiz
  question: |
    `status` дорівнює `"draft"`. Що зробить pytest з цим тестом?
    ```python
    def test_published():
        status = "draft"
        assert (status == "published", "form must be published")
    ```
  options:
    - "Червоний тест з `AssertionError: form must be published`"
    - "Червоний тест з розкладкою `assert 'draft' == 'published'`"
    - "Зелений тест і попередження `assertion is always true, perhaps remove parentheses?`"
    - "`SyntaxError`: `assert` не можна писати з дужками"
  answer: 2
  explain: |
    `assert` це оператор, а не функція, тож дужки створюють кортеж з двох елементів, а непорожній кортеж
    завжди truthy. Тест проходить за будь-якого `status`; pytest лише попереджає `PytestAssertRewriteWarning`.
    Перші два варіанти описують те, що дала б форма без дужок: `assert status == "published", "form must
    be published"`, і тоді pytest показує і повідомлення, і розкладку. Синтаксичної помилки немає:
    вираз у дужках цілком коректний, через це пастка і живуча.

- id: q4
  type: quiz
  question: |
    Скільки тестів збере pytest і який id буде першим?
    ```python
    @pytest.mark.parametrize("theme", ["light", "dark"])
    @pytest.mark.parametrize("required", [True, False])
    @pytest.mark.parametrize("input_type", ["text", "email", "tel"])
    def test_render(theme, required, input_type):
        pass
    ```
  options:
    - "3 тести, бо діє лише найближчий до функції декоратор; перший `test_render[text]`"
    - "7 тестів, по одному на кожне значення; перший `test_render[light]`"
    - "12 тестів; перший `test_render[light-True-text]`"
    - "12 тестів; перший `test_render[text-True-light]`"
  answer: 3
  explain: |
    Стек `parametrize` дає декартовий добуток: 2 × 2 × 3 = 12. Декоратори застосовуються знизу вгору,
    тому першим іде значення найближчого до функції, `input_type`, і саме воно змінюється найповільніше:
    `text-True-light`, `text-True-dark`, `text-False-light` і так далі. Порядок `light-True-text`
    був би, якби id читався в порядку написання декораторів зверху вниз. Варіант з 7 тестами це модель
    `it.each` на кожну таблицю окремо, а з 3 тестами модель "останній декоратор перезаписує попередні".

- id: p1
  type: project
  title: "Тести конфігу капстоуну: conftest, parametrize на 20 конфігів, tmp_path"
  prompt: |
    Продовження проєктного завдання m2-l09 (там з'явились моделі в `src/formbuilder/config.py`, `tests/test_models.py`
    і `tests/fixtures/form_signup.json`). Тепер тести отримують структуру з цього уроку.

    1. `tests/conftest.py` з трьома фікстурами з docstring: `signup_raw` (свіжий dict з
       `tests/fixtures/form_signup.json` на кожен тест), `make_form` (factory fixture мінімального валідного
       конфігу, іменовані аргументи замінюють ключі верхнього рівня), `write_config` (фабрика, що пише
       dict як JSON або сирий рядок у `tmp_path` і повертає шлях).
    2. У `tests/test_models.py` два параметризовані тести: валідні конфіги (тест лише перевіряє, що
       `model_validate` не кидає) і невалідні (очікують рівно одну помилку з конкретним `type`). Разом
       щонайменше 20 рядків, кожен через `pytest.param(..., id="...")` з читабельним id. Серед невалідних
       обов'язково: невідомий `type` елемента, зайвий ключ, `visible_if` на неіснуюче поле всередині `block`,
       порожній `title`, неправильний `primary_color`. Серед валідних: camelCase-ключі з фронтенду і вкладений `block`.
    3. У `src/formbuilder/config.py` поруч з моделями `ConfigError` і `load_config(path: Path) -> FormConfig`
       (як у розділі "Для капстоуну"), і `tests/test_config.py`: валідний файл, відсутній файл, файл не-JSON
       з перевіркою `__cause__`, валідний JSON з невалідним конфігом. Файли лише в `tmp_path`, без моків.
    4. `test_models.py` і `test_config.py` не імпортують одне одного й не імпортують `conftest.py`.
  checklist:
    - "`tests/conftest.py` має `signup_raw`, `make_form`, `write_config`, у кожної docstring; `uv run pytest --fixtures tests` їх показує"
    - "Параметризовані тести валідних і невалідних конфігів разом дають щонайменше 20 рядків, усі з явними `id`"
    - "Кожен невалідний рядок перевіряє список `type` помилок цілком (`== [\"extra_forbidden\"]`), а не лише факт `ValidationError`"
    - "`visible_if` на неіснуюче поле всередині `block` очікує `value_error`; camelCase-конфіг з фронтенду проходить"
    - "`load_config` перетворює відсутній файл, не-JSON і невалідний конфіг на `ConfigError`; тест не-JSON перевіряє `__cause__` з типом `json_invalid`"
    - "Жоден тест не пише файли поза `tmp_path` і не використовує моки"
    - "`uv run pytest -q` зелений, `uv run ruff check` і `uv run mypy src` проходять"
  verify: "cd capstone && uv run pytest -q"

- id: p2
  type: project
  title: "Строгий конфіг pytest і тести CLI через capsys"
  prompt: |
    Доведіть `[tool.pytest.ini_options]` капстоуну до робочого стану й покрийте точку входу з m0-l06.

    1. У `pyproject.toml` до наявних `testpaths` і `--import-mode=importlib` додайте `strict = true`
       (pytest 9: строгі маркери, конфіг, xfail і унікальні id параметрів), `-ra` в `addopts` і
       зареєстрований маркер `slow` з описом.
    2. `tests/test_cli.py`: `main(["--version"])` повертає 0 і друкує в stdout рівно
       `formbuilder <версія>\n` (через `capsys`); невідомий аргумент повертає 2, stdout порожній, stderr
       містить `unknown arguments`; виклик `main()` без аргументів читає `sys.argv`, підмінений через
       `monkeypatch.setattr("sys.argv", [...])`.
    3. Один тест з `@pytest.mark.slow`, що валідує 200 конфігів з `make_form`, і переконайтесь, що
       `uv run pytest -q -m "not slow"` його відфільтровує.
    4. Перевірте строгість: тимчасово напишіть `@pytest.mark.slwo` і переконайтесь, що збирання падає
       з `'slwo' not found in markers`; поверніть як було.
  checklist:
    - "`[tool.pytest.ini_options]` має `testpaths`, `addopts` з `--import-mode=importlib` і `-ra`, `strict = true`, `markers` зі `slow`"
    - "`tests/test_cli.py` перевіряє stdout `--version` рівністю рядка, код 2 і stderr для невідомого аргументу, і `sys.argv` через `monkeypatch`"
    - "`uv run pytest -q -m \"not slow\"` показує `1 deselected`"
    - "Опечатка в маркері дає помилку збирання, а не попередження"
    - "`uv run pytest -q` зелений"
  verify: "cd capstone && uv run pytest -q"
