      `Callable[[dict[str, Any]], str]`; повторна реєстрація кидає `ValueError`.
    - `timed(stage, *, clock=time.perf_counter)` для async-етапів пайплайну: логує через
      `logging.getLogger("formbuilder.pipeline")` рядок з назвою етапу й тривалістю, і в разі
      успіху, і в разі винятку. Повна конфігурація логування буде в m5-l09, тут лише `getLogger`.
    - `retry(times, delay, *, sleep=asyncio.sleep, exceptions=(ConnectionError,))` для публікації:
      експоненційна затримка `delay * 2 ** (attempt - 1)` між спробами, після останньої спроби
      виняток летить назовні.

