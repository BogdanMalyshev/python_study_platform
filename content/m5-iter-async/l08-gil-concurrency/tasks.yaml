  solution: |
    import asyncio
    import os
    from collections.abc import Callable
    from concurrent.futures import ProcessPoolExecutor
    from html import escape
    from pathlib import Path

    def render(config: dict) -> str:
        fields = "".join(
            f'<input name="{escape(f["id"])}" type="{escape(f["type"])}">' for f in config["fields"]
        )
        return f'<form id="{escape(config["id"])}">{fields}</form>'

    def render_pid(config: dict) -> str:
        return str(os.getpid())

    async def build(
        configs: list[dict], out_dir: Path, render_fn: Callable[[dict], str], workers: int = 4
    ) -> list[Path]:
        loop = asyncio.get_running_loop()
        with ProcessPoolExecutor(max_workers=workers) as pool:

            async def one(config: dict) -> Path:
                html = await loop.run_in_executor(pool, render_fn, config)
                path = out_dir / f"{config['id']}.html"
                await asyncio.to_thread(path.write_text, html)
                return path

            async with asyncio.TaskGroup() as tg:
                tasks = [tg.create_task(one(c)) for c in configs]
        return [t.result() for t in tasks]
  requires: []
  runtime: local
  verify: |
    PYTHONPATH=practice/m5-l08 .venv/bin/python -c "
    import asyncio, os, tempfile
    from pathlib import Path
    from build_pages import build, render, render_pid
    configs = [{'id': f'form-{i}', 'fields': [{'id': 'email', 'type': 'email'}]} for i in range(6)]
    with tempfile.TemporaryDirectory() as tmp:
        paths = asyncio.run(build(configs, Path(tmp), render, workers=2))
        assert [p.name for p in paths] == [f'form-{i}.html' for i in range(6)], paths
        assert paths[3].read_text() == '<form id=\"form-3\"><input name=\"email\" type=\"email\"></form>', paths[3].read_text()
        pids = {p.read_text() for p in asyncio.run(build(configs, Path(tmp), render_pid, workers=2))}
        assert str(os.getpid()) not in pids, 'render ran in the parent process: use ProcessPoolExecutor'
        assert 1 <= len(pids) <= 2, f'expected at most 2 worker processes, got {len(pids)}'
    print('OK')
    "

