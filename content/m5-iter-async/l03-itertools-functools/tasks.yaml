- id: q4
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    from functools import singledispatch

    @singledispatch
    def show(value) -> str:
        return "other"

    @show.register
    def _(value: int) -> str:
        return "int"

    @show.register
    def _(value: str) -> str:
        return "str"

    print(show(True), show(None), show("1"))
    ```
  options:
    - "other other str"
    - "int other str"
    - "bool other str"
    - "TypeError: no implementation for bool"
  answer: 1
  explain: |
    `bool` у Python це підклас `int` (`True == 1`), а `singledispatch` вибирає реалізацію
    за MRO типу: для `bool` найближчий зареєстрований предок `int`. Варіант 1 це JS-інтуїція,
    де `typeof true` це `"boolean"`, окремий від `"number"`. Варіант 3 припускає, що
    повертається назва типу, але повертається результат реалізації. Варіант 4 невірний,
    бо базова реалізація для `object` ловить усе, що не знайшлося в реєстрі, а `bool` до
    неї навіть не доходить.

- id: t5
  type: code
  title: "Рендер дерева через singledispatch"
  prompt: |
    Елементи форми це frozen dataclass-и `Input`, `Text` і `Block` (з кортежем `children`).
    Напишіть `render(el)` через `functools.singledispatch`:

    - `Input("email")` → `<input name="email">`
    - `Text("Hi")` → `<p>Hi</p>`
    - `Block((...))` → `<div>` + рендер дітей підряд + `</div>`
    - будь-який інший тип → `TypeError` з повідомленням `no renderer for <ім'я типу>`

    Підклас `EmailInput(Input)` має рендеритись як `Input` без окремої реєстрації.
  starter: |
    from dataclasses import dataclass
    from functools import singledispatch


    @dataclass(frozen=True)
    class Input:
        name: str


    @dataclass(frozen=True)
    class EmailInput(Input):
        pass


    @dataclass(frozen=True)
    class Text:
        text: str


    @dataclass(frozen=True)
    class Block:
        children: tuple = ()


    def render(el) -> str:
        ...
  harness: |
    print(render(Text("Contact")))
    print(render(Input("email")))
    print(render(EmailInput("work_email")))
    print(render(Block((Text("Hi"), Block((Input("a"), Input("b")))))))
    print(render(Block()))
    for bad in [{"type": "input"}, 42]:
        try:
            render(bad)
        except TypeError as e:
            print(e)
  expected: |
    <p>Contact</p>
    <input name="email">
    <input name="work_email">
    <div><p>Hi</p><div><input name="a"><input name="b"></div></div>
    <div></div>
    no renderer for dict
    no renderer for int
  hints:
    - "Базова функція під `@singledispatch` обробляє \"все інше\", тобто кидає помилку. Реалізації для конкретних типів реєструються окремо, тип береться з анотації першого параметра."
    - "`@render.register` над `def _(el: Input) -> str: ...`. Для `Block` рендер дітей це рекурсивний виклик `render(child)`, склеєний через `\"\".join`."
    - |
      ```python
      @singledispatch
      def render(el) -> str:
          raise TypeError(f"no renderer for {type(el).__name__}")

      @render.register
      def _(el: Block) -> str:
          return "<div>" + "".join(render(c) for c in el.children) + "</div>"
      ```
  solution: |
    from dataclasses import dataclass
    from functools import singledispatch


    @dataclass(frozen=True)
    class Input:
        name: str


    @dataclass(frozen=True)
    class EmailInput(Input):
        pass


    @dataclass(frozen=True)
    class Text:
        text: str


    @dataclass(frozen=True)
    class Block:
        children: tuple = ()


    @singledispatch
    def render(el) -> str:
        raise TypeError(f"no renderer for {type(el).__name__}")


    @render.register
    def _(el: Input) -> str:
        return f'<input name="{el.name}">'


    @render.register
    def _(el: Text) -> str:
        return f"<p>{el.text}</p>"


    @render.register
    def _(el: Block) -> str:
        return "<div>" + "".join(render(child) for child in el.children) + "</div>"
  requires: []
  runtime: browser

- id: t6
  type: code
  title: "Публікація сторінок пачками"
  prompt: |
    Зберіть публікацію FormBuilder з готових частин. Дано `render(el, *, theme)`, яка
    рендерить один елемент-словник з урахуванням теми. Напишіть
    `publish(pages, theme, batch_size)`, яка повертає список пачок для завантаження:

    - порожні сторінки пропускаються, але нумерація файлів іде за позицією сторінки в
      `pages` (сторінка на позиції 2 це `page-2.html`, навіть якщо перша порожня);
    - вміст файлу це рендери елементів сторінки, склеєні без роздільника; тему зафіксуйте
      один раз через `functools.partial`, а не передавайте в кожен виклик;
    - файли групуються в пачки по `batch_size`, кожна пачка це словник
      `{filename: html}`, остання пачка може бути меншою;
    - `pages` може бути генератором, тобто без `len` і індексів.

    ```python
    publish([[{"type": "text", "text": "Hi"}], [], [{"type": "input", "name": "email"}]], "dark", 2)
    # [{'page-1.html': '<p class="dark">Hi</p>', 'page-3.html': '<input name="email" class="dark">'}]
    ```
  starter: |
    from functools import partial
    from itertools import batched


    def render(el: dict, *, theme: str) -> str:
        if el["type"] == "input":
            return f'<input name="{el["name"]}" class="{theme}">'
        return f'<p class="{theme}">{el["text"]}</p>'


    def publish(pages, theme: str, batch_size: int) -> list[dict[str, str]]:
        ...
  harness: |
    pages = [
        [{"type": "text", "text": "Contact"}, {"type": "input", "name": "email"}],
        [],
        [{"type": "input", "name": "phone"}],
        [{"type": "text", "text": "Plan"}],
        [{"type": "text", "text": "Thanks"}],
    ]
    for batch in publish(pages, "dark", 2):
        print(batch)
    print(publish((p for p in pages), "light", 10)[0]["page-4.html"])
    print(publish([[], []], "dark", 2))
  expected: |
    {'page-1.html': '<p class="dark">Contact</p><input name="email" class="dark">', 'page-3.html': '<input name="phone" class="dark">'}
    {'page-4.html': '<p class="dark">Plan</p>', 'page-5.html': '<p class="dark">Thanks</p>'}
    <p class="light">Plan</p>
    []
  hints:
    - "Порядок кроків: пронумерувати сторінки, відкинути порожні, перетворити кожну на пару (ім'я файлу, html), нарізати пари на пачки, кожну пачку перетворити на словник."
    - "`render_el = partial(render, theme=theme)`; пари можна зібрати генераторним виразом по `enumerate(pages, start=1)` з умовою `if page`; `dict(batch)` перетворює кортеж пар на словник."
    - |
      ```python
      files = (
          (f"page-{n}.html", "".join(map(render_el, page)))
          for n, page in enumerate(pages, start=1)
          if page
      )
      return [dict(batch) for batch in batched(files, batch_size)]
      ```
  solution: |
    from functools import partial
    from itertools import batched


    def render(el: dict, *, theme: str) -> str:
        if el["type"] == "input":
            return f'<input name="{el["name"]}" class="{theme}">'
        return f'<p class="{theme}">{el["text"]}</p>'


    def publish(pages, theme: str, batch_size: int) -> list[dict[str, str]]:
        render_el = partial(render, theme=theme)
        files = (
            (f"page-{n}.html", "".join(map(render_el, page)))
            for n, page in enumerate(pages, start=1)
            if page
        )
        return [dict(batch) for batch in batched(files, batch_size)]
  requires: []
  runtime: browser
