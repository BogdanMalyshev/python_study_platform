    - "Хуки в AsyncClient мають бути async def. Хук відповіді бачить запит через response.request. Зверніть увагу на лог сценарію з таймаутами: хук відповіді не викликається, коли відповіді немає."
    - "`event_hooks={\"request\": [on_request], \"response\": [on_response]}`; у хуках `log.append(f\"-> {request.method} {request.url.path}\")` і `log.append(f\"<- {response.status_code} {response.request.url.path}\")`."
    - "`publish`: payload і headers збираються до циклу; цикл такий самий, як у t4: `try: r = await self.client.post(self.path, json=payload, headers=headers)`, `except httpx.TransportError: if last: raise`, `else: if r.status_code not in RETRY_STATUSES or last: return r.raise_for_status().json()[\"delivery_id\"]`, потім `await asyncio.sleep(self.base_delay * 2**attempt)`."
  solution: |
    import asyncio
    import httpx

    log: list[str] = []
    RETRY_STATUSES = {429, 500, 502, 503, 504}

    async def _on_request(request: httpx.Request) -> None:
        log.append(f"-> {request.method} {request.url.path}")

    async def _on_response(response: httpx.Response) -> None:
        log.append(f"<- {response.status_code} {response.request.url.path}")

    def make_client(transport: httpx.AsyncBaseTransport) -> httpx.AsyncClient:
        return httpx.AsyncClient(
            base_url="https://hooks.partner.example",
            timeout=httpx.Timeout(10.0, connect=3.0),
            transport=transport,
            event_hooks={"request": [_on_request], "response": [_on_response]},
        )

    class HttpPublisher:
        def __init__(self, client: httpx.AsyncClient, path: str, *, attempts: int = 4, base_delay: float = 0.5) -> None:
            self.client = client
            self.path = path
            self.attempts = attempts
            self.base_delay = base_delay

        async def publish(self, form_id: str, version: int, url: str) -> str:
            payload = {"form_id": form_id, "version": version, "url": url}
            headers = {"Idempotency-Key": f"{form_id}:{version}"}
            for attempt in range(self.attempts):
                last = attempt == self.attempts - 1
                try:
                    r = await self.client.post(self.path, json=payload, headers=headers)
                except httpx.TransportError:
                    if last:
                        raise
                else:
                    if r.status_code not in RETRY_STATUSES or last:
                        return r.raise_for_status().json()["delivery_id"]
                await asyncio.sleep(self.base_delay * 2**attempt)
            raise AssertionError("unreachable")
  requires: [httpx]
  runtime: browser

