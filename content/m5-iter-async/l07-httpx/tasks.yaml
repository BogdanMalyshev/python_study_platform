    import json as _json

    def _partner(script):
        sent = []
        steps = iter(script)
        def handler(request):
            sent.append(request)
            step = next(steps)
            if isinstance(step, httpx.Response):
                return step
            raise step("simulated", request=request)
        return handler, sent

    async def _scenario(name, script, attempts=4):
        log.clear()
        handler, sent = _partner(script)
        print(f"-- {name}")
        async with make_client(httpx.MockTransport(handler)) as client:
            print("timeout:", client.timeout, "base:", client.base_url)
            publisher = HttpPublisher(client, "/pages", attempts=attempts, base_delay=0.01)
            try:
                print("delivery:", await publisher.publish("contact", 3, "https://cdn.example.com/contact/v3/"))
            except httpx.HTTPError as exc:
                print("error:", type(exc).__name__)
        print("log:", log)
        print("keys:", sorted({r.headers.get("idempotency-key") for r in sent}, key=str))
        print("body:", _json.loads(sent[0].content))

    async def _main():
        await _scenario("503 then 200", [httpx.Response(503), httpx.Response(200, json={"delivery_id": "d-17"})])
        await _scenario("400", [httpx.Response(400, json={"detail": "bad url"})])
        await _scenario("timeouts", [httpx.ReadTimeout] * 3, attempts=3)

    asyncio.run(_main())
