- id: t1
  type: code
  title: "Зсув часового поясу з від'ємними хвилинами"
  prompt: |
    Напишіть `offset_parts(minutes)`, яка розкладає зсув часового поясу у хвилинах на кортеж
    `(знак, години, хвилини)`: знак це рядок `"+"` або `"-"`, години й хвилини невід'ємні цілі.
    Нуль має знак `"+"`. Склеювати з цього рядок `"-05:30"` будемо в m1-l04, коли з'являться f-рядки.

    ```python
    offset_parts(345)    # ('+', 5, 45)
    offset_parts(-330)   # ('-', 5, 30)
    offset_parts(0)      # ('+', 0, 0)
    ```

    Перевірте себе на `-330`: `divmod(-330, 60)` дає `(-6, 30)`, а не `(-5, -30)`, як підказує інтуїція з `Math.trunc`.
  starter: |
    def offset_parts(minutes: int) -> tuple[str, int, int]:
        ...
  harness: |
    print(offset_parts(0))
    print(offset_parts(120))
    print(offset_parts(345))
    print(offset_parts(-330))
    print(offset_parts(-30))
    print(offset_parts(-720))
    print(offset_parts(59))
  expected: |
    ('+', 0, 0)
    ('+', 2, 0)
    ('+', 5, 45)
    ('-', 5, 30)
    ('-', 0, 30)
    ('-', 12, 0)
    ('+', 0, 59)
  hints:
    - "Цілочисельне ділення й остача на від'ємному числі округлюють униз, а не до нуля. Знак варто відокремити від величини й ділити вже невід'ємне число."
    - "Знак дає умовний вираз `\"-\" if minutes < 0 else \"+\"`, величину `-minutes if minutes < 0 else minutes`."
    - "hours, mins = divmod(-minutes if minutes < 0 else minutes, 60); return sign, hours, mins."
  solution: |
    def offset_parts(minutes: int) -> tuple[str, int, int]:
        sign = "-" if minutes < 0 else "+"
        hours, mins = divmod(-minutes if minutes < 0 else minutes, 60)
        return sign, hours, mins
  requires: []
  runtime: browser

- id: t2
  type: code
  title: "JSON-тип значення"
  prompt: |
    Напишіть `json_type(value)`, яка повертає назву JSON-типу для значення, отриманого з `json.loads`:

    | Python | результат |
    |---|---|
    | `None` | `"null"` |
    | `bool` | `"boolean"` |
    | `int`, `float` | `"number"` |
    | `str` | `"string"` |
    | `list` | `"array"` |
    | `dict` | `"object"` |

    Для будь-якого іншого типу (наприклад, кортежу) функція повертає `None`: такого значення JSON не дає.

    ```python
    json_type(True)     # 'boolean'
    json_type(2.5)      # 'number'
    json_type((1, 2))   # None
    ```
  starter: |
    def json_type(value):
        ...
  harness: |
    print(repr(None), json_type(None))
    print(repr(True), json_type(True))
    print(repr(False), json_type(False))
    print(repr(0), json_type(0))
    print(repr(2.5), json_type(2.5))
    print(repr(2 ** 70), json_type(2 ** 70))
    print(repr("x"), json_type("x"))
    print(repr(""), json_type(""))
    print(repr([1]), json_type([1]))
    print(repr({"a": 1}), json_type({"a": 1}))
    print(repr((1, 2)), json_type((1, 2)))
  expected: |
    None null
    True boolean
    False boolean
    0 number
    2.5 number
    1180591620717411303424 number
    'x' string
    '' string
    [1] array
    {'a': 1} object
    (1, 2) None
  hints:
    - "`True` проходить `isinstance(value, int)`, бо `bool` підклас `int`. Порядок перевірок вирішує все."
    - "Спершу `value is None`, потім `isinstance(value, bool)`, і лише потім `isinstance(value, (int, float))`. Після всіх перевірок `return None`."
  solution: |
    def json_type(value):
        if value is None:
            return "null"
        if isinstance(value, bool):
            return "boolean"
        if isinstance(value, (int, float)):
            return "number"
        if isinstance(value, str):
            return "string"
        if isinstance(value, list):
            return "array"
        if isinstance(value, dict):
            return "object"
        return None
  requires: []
  runtime: browser

- id: t3
  type: code
  title: "Optional chaining і ?? для вкладеного конфігу"
  prompt: |
    Напишіть `get_in(data, key1, key2, default=None)`, Python-версію виразу `data?.[key1]?.[key2] ?? default`
    рівно для двох рівнів вкладеності. Функція повертає `default`, якщо:

    - ключа `key1` немає, або значення під ним `None` чи взагалі не словник (наприклад, рядок);
    - ключа `key2` немає у вкладеному словнику;
    - кінцеве значення `None`.

    Хибні, але не `None` значення (`0`, `""`, `False`, `[]`) повертаються як є: це семантика `??`, а не `||`.

    ```python
    config = {"validation": {"max": 100, "min": 0}, "options": None}
    get_in(config, "validation", "max")        # 100
    get_in(config, "validation", "min", 5)     # 0
    get_in(config, "options", "first", "-")    # '-'
    ```
  starter: |
    def get_in(data: dict, key1: str, key2: str, default=None):
        ...
  harness: |
    config = {
        "id": "email",
        "options": None,
        "flags": {"required": False, "label": ""},
        "validation": {"max": 100, "min": 0, "pattern": None},
    }
    print(repr(get_in(config, "validation", "max")))
    print(repr(get_in(config, "validation", "min", 5)))
    print(repr(get_in(config, "validation", "pattern", ".*")))
    print(repr(get_in(config, "flags", "label", "Email")))
    print(repr(get_in(config, "flags", "required", True)))
    print(repr(get_in(config, "options", "first", "-")))
    print(repr(get_in(config, "id", "length", -1)))
    print(repr(get_in(config, "missing", "deep")))
    print(repr(get_in(config, "validation", "step", 1)))
  expected: |
    100
    0
    '.*'
    ''
    False
    '-'
    -1
    None
    1
  hints:
    - "Перший рівень читайте через `.get`: відсутній ключ сам дасть `None`. Перш ніж іти глибше, переконайтесь, що отримане значення це словник."
    - "inner = data.get(key1); if not isinstance(inner, dict): return default. Наприкінці потрібен умовний вираз з `is not None`, а не `value or default`."
    - "value = inner.get(key2); return value if value is not None else default."
  solution: |
    def get_in(data: dict, key1: str, key2: str, default=None):
        inner = data.get(key1)
        if not isinstance(inner, dict):
            return default
        value = inner.get(key2)
        return value if value is not None else default
  requires: []
  runtime: browser

- id: t4
  type: code
  title: "Ціна з рядка в копійки без float"
  prompt: |
    Напишіть `to_cents(price)`, яка перетворює рядок з ціною на ціле число копійок (центів).
    Рядок містить ціле або дробове число з не більше ніж двома знаками після крапки, може бути від'ємним
    і може мати пробіли навколо. Суми бувають довільно великі, тому результат має бути точним для будь-якої довжини.

    ```python
    to_cents("19.99")   # 1999
    to_cents("-0.5")    # -50
    to_cents(" 5 ")     # 500
    ```

    Наївне `int(float(price) * 100)` на `"4.35"` дає `434`. `round(...)` рятує малі суми, але не великі.
  starter: |
    def to_cents(price: str) -> int:
        ...
  harness: |
    for p in ["19.99", "4.35", "0.07", "5", " 1.10 ", "-0.5", "-12.30", "123456789012345678.90"]:
        print(repr(p), to_cents(p))
  expected: |
    '19.99' 1999
    '4.35' 435
    '0.07' 7
    '5' 500
    ' 1.10 ' 110
    '-0.5' -50
    '-12.30' -1230
    '123456789012345678.90' 12345678901234567890
  hints:
    - "`float` має 53 біти точності, тож через нього не можна ні множити, ні передавати великі суми. Потрібна десяткова арифметика або робота з рядком."
    - "from decimal import Decimal; int(Decimal(price) * 100). Decimal створюється з рядка, а не з float, і сам ігнорує пробіли навколо числа."
  solution: |
    from decimal import Decimal


    def to_cents(price: str) -> int:
        return int(Decimal(price) * 100)
  requires: []
  runtime: browser

- id: q1
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    print(-7 // 2, -7 % 2)
    ```
  options: ["-4 1", "-3 -1", "-4 -1", "-3 1"]
  answer: 0
  explain: |
    `//` округлює вниз, до мінус нескінченності: `-3.5` стає `-4`. Остача узгоджена з часткою тотожністю
    `a == (a // b) * b + a % b`: `-4 * 2 + 1 == -7`, тому `%` дає `1`, зі знаком дільника.
    `-3 -1` це поведінка JS (`Math.trunc` і `%` зі знаком діленого). `-4 -1` змішує floor-частку з JS-остачею,
    і тотожність не сходиться. `-3 1` теж: `-3 * 2 + 1 == -5`.

- id: q2
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    print({1: "a", True: "b", 1.0: "c"})
    ```
  options: ["{1: 'a', True: 'b', 1.0: 'c'}", "{1: 'c'}", "{True: 'c'}", "{1: 'a'}"]
  answer: 1
  explain: |
    `1`, `True` і `1.0` рівні між собою й мають однаковий хеш, тож для словника це один ключ.
    Ключ лишається від першого вставлення (`1`), а значення перезаписується останнім (`'c'`).
    Три окремі ключі це інтуїція JS-об'єкта, де ключі рядки `"1"`, `"true"`, `"1"`, але й там `1` і `1.0` злились би.
    `{True: 'c'}` вгадує правило для значення, але не для ключа. `{1: 'a'}` вважає, що повторний ключ ігнорується, а він перезаписує значення.

- id: q3
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    print("2" * 3, int("2") * 3)
    ```
  options: ["222 6", "6 6", "TypeError", "222 222"]
  answer: 0
  explain: |
    Множення рядка на ціле це повторення послідовності, тому `"2" * 3` дає `"222"`, а `int("2") * 3` звичайне `6`.
    `6 6` це коерція з JS, де `"2" * 3` перетворює рядок на число; у Python такого кроку немає.
    `TypeError` був би для `"2" + 3` чи `"2" * 3.0`, але `str` визначає множення на `int`.
    `222 222` переплутав порядок: після `int("2")` це вже число.

- id: q4
  type: quiz
  question: |
    Що станеться під час виконання?
    ```python
    def total(price: int, qty: int) -> int:
        return price * qty

    print(total("ab", 2))
    ```
  options: ["Надрукує abab", "TypeError: price must be int", "Надрукує 0", "Помилка ще до запуску, як у tsc"]
  answer: 0
  explain: |
    Інтерпретатор зберігає анотації в `__annotations__`, але не перевіряє їх ні при виклику, ні при поверненні.
    Код виконується як без анотацій: `"ab" * 2` це повторення рядка, `abab`.
    `TypeError` і "помилка до запуску" це очікування з TS; таку помилку покаже mypy або pyright, якщо їх запустити окремо,
    або Pydantic, якщо дані йдуть через модель. `0` з'явився б лише за неявного приведення `"ab"` до числа, якого в Python немає.
