- id: q1
  type: quiz
  question: |
    Функція `build` упала з таким traceback. Який кадр останній із вашого коду, тобто з якого рядка починати читати?
    ```text
    Traceback (most recent call last):
      File "config.py", line 14, in <module>
        build('{"title": "Signup", "fields": [],}')
      File "config.py", line 10, in build
        config = load_config(raw)
                 ^^^^^^^^^^^^^^^^
      File "config.py", line 5, in load_config
        config = json.loads(raw)
                 ^^^^^^^^^^^^^^^
      File ".../lib/python3.12/json/__init__.py", line 346, in loads
        return _default_decoder.decode(s)
               ^^^^^^^^^^^^^^^^^^^^^^^^^^
      File ".../lib/python3.12/json/decoder.py", line 338, in decode
        obj, end = self.raw_decode(s, idx=_w(s, 0).end())
                   ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
      File ".../lib/python3.12/json/decoder.py", line 354, in raw_decode
        obj, end = self.scan_once(s, idx)
                   ^^^^^^^^^^^^^^^^^^^^^^
    json.decoder.JSONDecodeError: Expecting property name enclosed in double quotes: line 1 column 34 (char 33)
    ```
  options:
    - "`decoder.py`, рядок 354, у `raw_decode`"
    - "`config.py`, рядок 5, у `load_config`"
    - "`config.py`, рядок 14, у `<module>`"
    - "`json/__init__.py`, рядок 346, у `loads`"
  answer: 1
  explain: |
    Кадри йдуть від точки входу вниз до місця, де виникла помилка. Три нижні кадри лежать у `.../lib/python3.12/json/`,
    це стандартна бібліотека: вона виконала свою роботу правильно й повідомила, що вхід поганий. Останній кадр з вашого
    файлу `config.py` це рядок 5, де ви передали рядок у `json.loads`. Варіант з `decoder.py` спокусливий звичкою
    "дивитися на самий низ", але правити stdlib ви не будете. Рядок 14 це точка входу, з нього стек лише починається;
    хоча саме там лежить зіпсований JSON з комою перед `}` (символ 33), до цього висновку ви доходите, прочитавши
    повідомлення і піднявшись від рядка 5 вгору.

- id: q2
  type: quiz
  question: |
    Перший виклик надрукував `100.0`, другий упав. У якому рядку баг?
    ```python
    def percent(part: int, total: int) -> float:
        return round(part / total * 100, 1)


    def completion(fields: list[str], answers: dict) -> float:
        filled = sum(1 for f in fields if answers.get(f))
        return percent(len(fields), filled)


    print(completion(["email", "age"], {"email": "a@b.c", "age": 30}))
    print(completion(["email", "age"], {}))
    ```
    ```text
    100.0
    Traceback (most recent call last):
      File "report.py", line 11, in <module>
        print(completion(["email", "age"], {}))
              ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
      File "report.py", line 7, in completion
        return percent(len(fields), filled)
               ^^^^^^^^^^^^^^^^^^^^^^^^^^^^
      File "report.py", line 2, in percent
        return round(part / total * 100, 1)
                     ~~~~~^~~~~~~
    ZeroDivisionError: division by zero
    ```
  options:
    - "Рядок 2: потрібна перевірка `total == 0` у `percent`"
    - "Рядок 7: аргументи `percent` переставлені місцями"
    - "Рядок 11: не можна передавати порожній словник"
    - "Рядок 6: `sum` з генератором повертає 0 замість кількості"
  answer: 1
  explain: |
    Останній кадр показує, де програма впала, а не де помилка. `percent(part, total)` отримує `len(fields)` як `part`
    і `filled` як `total`, тобто ділить 2 на 0. Перший виклик "працював" лише тому, що там `filled == len(fields)`
    і перестановка не змінює результат. Перевірка `total == 0` у рядку 2 сховала б симптом і повертала б неправильні
    відсотки для всіх інших випадків. Порожній словник це легальний вхід: жодне поле не заповнене, очікується `0.0`.
    `sum(1 for ...)` рахує правильно, тут він дав чесний нуль.

- id: q3
  type: quiz
  question: |
    Програма впала з таким виводом. Який виняток виник першим і з яким програма завершилась?
    ```text
    Traceback (most recent call last):
      File "chain.py", line 6, in load_config
        return json.loads(raw)
               ^^^^^^^^^^^^^^^
      File ".../lib/python3.12/json/decoder.py", line 354, in raw_decode
        obj, end = self.scan_once(s, idx)
                   ^^^^^^^^^^^^^^^^^^^^^^
    json.decoder.JSONDecodeError: Expecting property name enclosed in double quotes: line 1 column 20 (char 19)

    The above exception was the direct cause of the following exception:

    Traceback (most recent call last):
      File "chain.py", line 11, in <module>
        load_config('{"title": "Signup",}')
      File "chain.py", line 8, in load_config
        raise ValueError("config is not valid JSON") from e
    ValueError: config is not valid JSON
    ```
  options:
    - "Першим `JSONDecodeError`, завершилась на `ValueError`"
    - "Першим `ValueError`, завершилась на `JSONDecodeError`"
    - "Це два незалежні збої в різних місцях програми"
    - "Завершилась на `JSONDecodeError`, а `ValueError` лише примітка до нього"
  answer: 0
  explain: |
    Ланцюжок друкується в хронологічному порядку: спершу причина, потім фраза-зв'язка, потім виняток, який долетів до
    верху і зупинив програму. Тому самий нижній рядок усього виводу, `ValueError`, і є фінальним винятком, а
    `JSONDecodeError` лежить у його `__cause__`. Звичка JS читати першим верхній рядок підказує другий варіант,
    але тут верх це початок історії. "The above exception was the direct cause" означає навмисне `raise ... from e`,
    тож збої не незалежні: другий кинуто свідомо через перший.

- id: q4
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    value = "30"
    print(f"{value=}")
    ```
  options: ["value=30", "value='30'", "30", "value=\"30\""]
  answer: 1
  explain: |
    Специфікатор `=` у f-рядку друкує сам вираз, знак `=` і `repr` значення, тому рядок отримує лапки: `value='30'`.
    Саме це робить його корисним для дебагу: число `30` і рядок `"30"` у виводі розрізняються. `value=30` це те, що дав би
    `print("value=", value)` або `f"value={value}"`, які використовують `str`. Подвійних лапок не буде, бо `repr` рядка
    віддає одинарні, якщо всередині немає одинарної лапки.

- id: t1
