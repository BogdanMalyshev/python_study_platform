- id: t2
  type: code
  title: "Кадри з вашого коду"
  prompt: |
    Напишіть `own_frames(tb, root)`, яка повертає кадри traceback, що належать вашому проєкту: список кортежів
    `(path, line, func)`, де `path` це шлях відносно `root`, `line` це `int`.

    Правила:
    - кадр це рядок виду `  File "<шлях>", line <N>, in <функція>`;
    - ваш кадр це той, чий шлях починається з `root + "/"`; кадри stdlib і сторонніх пакетів відкидаються;
    - якщо traceback це ланцюжок, беруться кадри лише останнього блоку, того, що після останнього
      `Traceback (most recent call last):`, бо саме він описує виняток, який зупинив програму;
    - порядок той самий, що в traceback: від точки входу до найглибшого кадру.

    ```python
    own_frames(tb, "/app")
    # [('main.py', 3, '<module>'), ('formbuilder/loader.py', 12, 'load_config')]
    ```
  starter: |
    import re


    def own_frames(tb: str, root: str) -> list[tuple[str, int, str]]:
        ...
  harness: |
    tb = '''Traceback (most recent call last):
      File "/app/main.py", line 3, in <module>
        load_config(path)
      File "/app/formbuilder/loader.py", line 12, in load_config
        return json.loads(text)
               ^^^^^^^^^^^^^^^^
      File "/usr/lib/python3.12/json/__init__.py", line 346, in loads
        return _default_decoder.decode(s)
               ^^^^^^^^^^^^^^^^^^^^^^^^^^
      File "/usr/lib/python3.12/json/decoder.py", line 356, in raw_decode
        raise JSONDecodeError("Expecting value", s, err.value) from None
    json.decoder.JSONDecodeError: Expecting value: line 1 column 11 (char 10)
    '''
    chained = '''Traceback (most recent call last):
      File "/app/formbuilder/widgets.py", line 6, in widget_for
        return WIDGETS[field["type"]]
               ~~~~~~~^^^^^^^^^^^^^^^
    KeyError: 'date'

    During handling of the above exception, another exception occurred:

    Traceback (most recent call last):
      File "/app/main.py", line 11, in <module>
        widget_for({"id": "dob", "type": "date"})
      File "/app/formbuilder/widgets.py", line 8, in widget_for
        return WIDGETS[field["fallback"]]
                       ~~~~~^^^^^^^^^^^^
    KeyError: 'fallback'
    '''
    lib_only = '''Traceback (most recent call last):
      File "/usr/lib/python3.12/runpy.py", line 198, in _run_module_as_main
        return _run_code(code, main_globals, None,
    ModuleNotFoundError: No module named 'formbuilder'
    '''
    print(own_frames(tb, "/app"))
    print(own_frames(chained, "/app"))
    print(own_frames(lib_only, "/app"))
    print(own_frames(tb, "/app/formbuilder"))
    print(own_frames(tb, "/ap"))
  expected: |
    [('main.py', 3, '<module>'), ('formbuilder/loader.py', 12, 'load_config')]
    [('main.py', 11, '<module>'), ('formbuilder/widgets.py', 8, 'widget_for')]
    []
    [('loader.py', 12, 'load_config')]
    []
  hints:
    - "Спершу відріжте все до останнього заголовка Traceback, потім знайдіть рядки кадрів регулярним виразом із трьома групами, а префікс перевіряйте разом зі слешем, щоб /ap не збігався з /app."
    - "block = tb.rsplit(\"Traceback (most recent call last):\", 1)[-1]; re.finditer(r'^  File \"(.+?)\", line (\\d+), in (.+)$', block, re.M); далі path.startswith(root + \"/\") і path[len(root) + 1:]."
  solution: |
    import re


    def own_frames(tb: str, root: str) -> list[tuple[str, int, str]]:
        block = tb.rsplit("Traceback (most recent call last):", 1)[-1]
        prefix = root + "/"
        frames = []
        for m in re.finditer(r'^  File "(.+?)", line (\d+), in (.+)$', block, re.M):
            path, line, func = m.groups()
            if path.startswith(prefix):
                frames.append((path[len(prefix):], int(line), func))
        return frames
  requires: []
  runtime: browser

- id: t3
