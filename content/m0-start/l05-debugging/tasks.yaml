    ValueError: config is not valid JSON


    '''
    quit_tb = '''Traceback (most recent call last):
      File ".../lib/python3.12/bdb.py", line 125, in dispatch_line
        if self.quitting: raise BdbQuit
    bdb.BdbQuit'''
    json_tb = '''  File ".../lib/python3.12/json/decoder.py", line 356, in raw_decode
        raise JSONDecodeError("Expecting value", s, err.value) from None
    json.decoder.JSONDecodeError: Expecting value: line 1 column 11 (char 10)'''
    print(exception_summary(simple))
    print(exception_summary(chained))
    print(exception_summary(quit_tb))
    print(exception_summary(json_tb))
  expected: |
    ('KeyError', "'age'")
    ('ValueError', 'config is not valid JSON')
