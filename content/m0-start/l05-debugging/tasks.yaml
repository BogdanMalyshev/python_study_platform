  hints:
    - "Порожні рядки в кінці треба відкинути до того, як брати останній; далі рядок ділиться лише по першому входженню роздільника."
    - "tb.strip().splitlines()[-1] дає останній змістовний рядок, а str.partition(\": \") повертає три частини і не падає, коли роздільника немає."
  solution: |
    def exception_summary(tb: str) -> tuple[str, str]:
        last = tb.strip().splitlines()[-1]
        exc_type, _, message = last.partition(": ")
