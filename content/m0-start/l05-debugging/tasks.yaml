  title: "Баг вище за стек"
  prompt: |
    Цей код упав на одній із реальних відповідей форми:

    ```text
    Traceback (most recent call last):
      File "main.py", line 17, in <module>
        print(summary({"Email": "bob@y.dev", " Age": " 27"}))
              ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^
      File "main.py", line 14, in summary
        return f"{answers['email']} ({age_of(answers)})"
                                      ^^^^^^^^^^^^^^^
      File "main.py", line 9, in age_of
        return int(answers["age"])
                   ~~~~~~~^^^^^^^
    KeyError: 'age'
    ```

    Знайдіть причину й виправте її там, де вона виникає, а не там, де програма впала. Ключі відповідей мають
    нормалізуватися так, щоб регістр і пробіли навколо ключа не мали значення. Підказка до методу: `KeyError` каже,
    чого немає; щоб побачити, що є, додайте `print(f"{answers=}")` у `summary` і запустіть.

    Харнес перевіряє і `summary`, і саму `parse_answers`, тож обхід через `answers.get(...)` в `age_of` не пройде.
  starter: |
    def parse_answers(raw: dict[str, str]) -> dict[str, str]:
        answers = {}
        for key, value in raw.items():
            answers[key.lower()] = value.strip()
        return answers


    def age_of(answers: dict[str, str]) -> int:
        return int(answers["age"])


    def summary(raw: dict[str, str]) -> str:
        answers = parse_answers(raw)
        return f"{answers['email']} ({age_of(answers)})"
  harness: |
    print(summary({"email": "a@b.c", "age": "30"}))
    print(summary({"Email": "bob@y.dev", " Age": " 27"}))
    print(summary({" EMAIL ": " ann@x.io ", "age\t": "41"}))
    print(parse_answers({" Age ": " 27 ", "Name": "Bob"}))
  expected: |
    a@b.c (30)
    bob@y.dev (27)
    ann@x.io (41)
    {'age': '27', 'name': 'Bob'}
  hints:
    - "Функції parse_answers у traceback немає: вона вже повернула результат до того, як age_of упала. Подивіться, які ключі вона повернула для ' Age'."
    - "print(f\"{answers=}\") покаже {'email': 'bob@y.dev', ' age': '27'}: ключ з пробілом. У parse_answers ключ треба не лише перевести в нижній регістр, а й обрізати: key.strip().lower()."
  solution: |
    def parse_answers(raw: dict[str, str]) -> dict[str, str]:
        answers = {}
        for key, value in raw.items():
            answers[key.strip().lower()] = value.strip()
        return answers


    def age_of(answers: dict[str, str]) -> int:
        return int(answers["age"])


    def summary(raw: dict[str, str]) -> str:
        answers = parse_answers(raw)
        return f"{answers['email']} ({age_of(answers)})"
  requires: []
  runtime: browser

- id: t4
  type: code
  title: "Звіт перевірок без падіння"
  prompt: |
    Напишіть `run_checks(checks)`: словник `{назва: функція без аргументів}`. Функція викликає кожну перевірку
    по черзі й повертає список рядків звіту. Програма не падає, навіть якщо всі перевірки кидають винятки.

    - перевірка пройшла: `"<назва>: ok"`;
    - перевірка кинула виняток (нащадок `Exception`): `"<назва>: FAIL <останній рядок traceback> (in <функція>)"`,
      де останній рядок це те, що Python надрукував би внизу traceback (тип з модулем і повідомлення),
      а `<функція>` це ім'я найглибшого кадру, в якому виник виняток.

    Текст traceback руками не розбирати: модуль `traceback` уміє віддати і останній рядок, і кадри як об'єкти.

    ```python
    run_checks({"zero": lambda: 1 / 0})
    # ['zero: FAIL ZeroDivisionError: division by zero (in <lambda>)']
    ```
  starter: |
    import traceback
    from collections.abc import Callable


    def run_checks(checks: dict[str, Callable[[], object]]) -> list[str]:
        ...
  harness: |
    import json


    def parse_age(raw: str) -> int:
        return int(raw)


    def load_title(raw: str) -> str:
        return json.loads(raw)["title"]


    checks = {
        "age": lambda: parse_age("30"),
        "bad age": lambda: parse_age("thirty"),
        "title": lambda: load_title('{"title": "Signup"}'),
        "no title": lambda: load_title('{"name": "Signup"}'),
        "broken json": lambda: load_title('{"title": }'),
        "zero": lambda: 1 / 0,
    }
    for line in run_checks(checks):
        print(line)
    print(run_checks({}))
  expected: |
    age: ok
    bad age: FAIL ValueError: invalid literal for int() with base 10: 'thirty' (in parse_age)
    title: ok
    no title: FAIL KeyError: 'title' (in load_title)
    broken json: FAIL json.decoder.JSONDecodeError: Expecting value: line 1 column 11 (char 10) (in raw_decode)
    zero: FAIL ZeroDivisionError: division by zero (in <lambda>)
    []
  hints:
    - "try / except Exception as e навколо виклику; рядок і кадр дістаються з самого об'єкта винятку, без print_exc."
    - "traceback.format_exception_only(e)[-1].strip() дає останній рядок; traceback.extract_tb(e.__traceback__)[-1].name дає ім'я найглибшої функції."
  solution: |
    import traceback
    from collections.abc import Callable


    def run_checks(checks: dict[str, Callable[[], object]]) -> list[str]:
        report = []
        for name, check in checks.items():
            try:
                check()
            except Exception as e:
                last_line = traceback.format_exception_only(e)[-1].strip()
                where = traceback.extract_tb(e.__traceback__)[-1].name
                report.append(f"{name}: FAIL {last_line} (in {where})")
            else:
                report.append(f"{name}: ok")
        return report
  requires: []
  runtime: browser

- id: p1
  type: project
  title: "pdb-сесія як файл: знайти два баги в розрахунку замовлення"
  prompt: |
    У корені курсу (поруч із `.venv`) створіть папку `practice/m0-l05/` і файл `practice/m0-l05/discount.py` з таким кодом:

    ```python
    PROMOS = {"SPRING": 10, "VIP": 25}


    def discount_percent(codes: list[str]) -> int:
        best = 0
        for code in codes:
            percent = PROMOS.get(code.upper(), 0)
            if percent > best:
                best = percent
        return best


    def line_total(price: float, qty: int, percent: int) -> float:
        return price * qty * (100 - percent) / 100


    def order_total(items: list[dict], codes: list[str]) -> float:
        percent = discount_percent(codes)
        total = 0.0
        for item in items:
            total = line_total(item["price"], item["qty"], percent)
        return round(total, 2)


    items = [{"price": 40.0, "qty": 2}, {"price": 15.5, "qty": 4}]
    codes = [" vip", "spring"]
    print(order_total(items, codes))
    ```

    Скрипт друкує `55.8`. Правильна відповідь `106.5`: сума 80 + 62 = 142, найкращий код `VIP` дає 25%.
    Помилки не видно в traceback, бо винятку немає; знайдіть обидва баги через pdb.

