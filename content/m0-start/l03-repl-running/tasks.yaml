- id: t1
  type: code
  title: "Перший аргумент без process.argv[2]"
  prompt: |
    Скрипт `check.py` приймає шлях до конфігу першим аргументом. Напишіть `target_from_argv(argv, default)`,
    яка отримує список у форматі `sys.argv` і повертає перший аргумент після імені скрипта,
    а якщо аргументів немає, повертає `default`. Решту аргументів ігнорувати.

    Нагадування: у Python `argv[0]` це ім'я скрипта (або `-c`, або повний шлях при `-m`),
    шляху до інтерпретатора в списку немає. Усе потрібне є в `check.py` вище: перевірка `len(argv)`,
    `argv[1]` і ранній `return` з функції.

    ```python
    target_from_argv(["check.py", "contact.json"])   # 'contact.json'
    target_from_argv(["check.py"])                   # 'form.json'
    ```
  starter: |
    def target_from_argv(argv: list[str], default: str = "form.json") -> str:
        ...
  harness: |
    print(target_from_argv(["check.py", "contact.json"]))
    print(target_from_argv(["check.py"]))
    print(target_from_argv(["/home/dev/tools/check.py", "a.json", "b.json"]))
    print(target_from_argv(["-c", "x.json"], default="none"))
    print(target_from_argv(["-c"], default="none"))
  expected: |
    contact.json
    form.json
    a.json
    x.json
    none
  hints:
    - "Аргументи користувача починаються з індексу 1, а не 2: інтерпретатора в sys.argv немає. Згадайте, як check.py перевіряє кількість аргументів."
    - "check.py пише if len(argv) != 2: ... return 2. Тут умова інша: аргумент є, якщо len(argv) > 1."
    - "if len(argv) > 1: return argv[1], а після if рядком нижче return default."
  solution: |
    def target_from_argv(argv: list[str], default: str = "form.json") -> str:
        if len(argv) > 1:
            return argv[1]
        return default
  requires: []
  runtime: browser

- id: q1
  type: quiz
  question: |
    У директорії два файли. Що надрукує `python report.py`?
    ```python
    # labels.py
    print("labels:", __name__)
    ```
    ```python
    # report.py
    import labels
    print("report:", __name__)
    ```
  options:
    - "`labels: labels` і `report: __main__`"
    - "`labels: __main__` і `report: __main__`"
    - "`labels: labels.py` і `report: report.py`"
    - "лише `report: __main__`, бо `labels.py` не має guard"
  answer: 0
  explain: |
    `__name__` модуля дорівнює імені, під яким його імпортували, тобто `"labels"` без `.py`. `"__main__"` отримує
    лише той модуль, з якого почався запуск. Варіант з двома `__main__` це інтуїція "скрипт один, тож і ім'я одне",
    але кожен модуль має своє. `.py` в імені з'являється лише в шляху `__file__`. Останній варіант плутає причину й наслідок:
    guard не забороняє виконання модуля при імпорті, навпаки, без guard увесь верхній рівень виконується, і `print` спрацює.

- id: q2
  type: quiz
  question: |
    Що станеться при `python app.py`?
    ```python
    # app.py
    def main() -> None:
        print("building form")

    if __name__ == "main":
        main()
    ```
  options:
    - "Нічого не надрукується, код завершення 0"
    - "Надрукується `building form`"
    - "`NameError: name 'main' is not defined`"
    - "`SyntaxError` у рядку з `if`"
  answer: 0
  explain: |
    При прямому запуску `__name__` дорівнює `"__main__"` з двома підкресленнями з кожного боку. Порівняння з `"main"`
    просто дає `False`: це звичайне порівняння рядків, мова не знає, що ви мали на увазі. Тому `main()` не викликається,
    скрипт мовчки завершується з кодом 0. `NameError` неможливий: `__name__` існує завжди, а функція `main` визначена.
    `SyntaxError` теж ні, синтаксис коректний. Саме тому помилка підступна: ні traceback, ні ненульового коду.

- id: q3
  type: quiz
  question: |
    Що надрукує `python -O limits.py`?
    ```python
    # limits.py
    def set_limit(n: int) -> int:
        assert n > 0, "limit must be positive"
        return n

    print(set_limit(-5))
    ```
  options:
    - "`-5`"
    - "`AssertionError: limit must be positive`"
    - "`0`"
    - "`None`"
  answer: 0
  explain: |
    `-O` вмикає оптимізований режим: `__debug__` стає `False`, і компілятор у байткод узагалі не вставляє інструкції для `assert`.
    Перевірки немає, функція повертає `-5`. `AssertionError` це поведінка без `-O`, і саме вона змушує думати, що `assert`
    придатний для валідації вхідних даних. `0` і `None` вигадують якусь "безпечну заміну", якої немає: `assert` просто зникає.
    Для валідації пишуть `if ...: raise ValueError(...)`.

- id: q4
  type: quiz
  question: |
    Який код завершення покаже `echo $?` після цього скрипта?
    ```python
    # load.py
    import sys

    sys.exit("error: config not found")
    ```
  options: ["1", "0", "255", "Помилка: sys.exit приймає лише int"]
  answer: 0
  explain: |
    `sys.exit` з рядком друкує цей рядок у stderr і завершує процес з кодом 1. `0` спокусливий, бо немає traceback
    і виглядає як штатне завершення, але будь-який аргумент, крім `None` і цілого числа, означає помилку з кодом 1.
    `255` це плутанина з `exit(-1)` у C і shell. Рядок як аргумент документований: `SystemExit` приймає будь-який об'єкт,
    і саме так зручно завершувати CLI з повідомленням.

- id: q5
  type: quiz
  question: |
    Проєкт лежить у `/proj`, файл `/proj/src/app/main.py` друкує `sys.path[0]`. Його запускають двома способами:
    ```bash
    cd /proj/src && python -m app.main
    cd /proj && python src/app/main.py
    ```
    Що надрукують ці два запуски, по черзі?
  options:
    - "`/proj/src`, потім `/proj/src/app`"
    - "`/proj/src/app` в обох випадках"
    - "`/proj/src`, потім `/proj`"
    - "порожній рядок, потім `/proj/src/app`"
  answer: 0
  explain: |
    `sys.path[0]` залежить від способу запуску. При `python -m` це поточна директорія, тобто `/proj/src`,
    і саме тому там знаходиться пакет `app`. При `python file.py` це директорія скрипта, незалежно від
    того, звідки його запустили: `/proj/src/app`. Варіант з `/proj/src/app` двічі це інтуїція Node, де
    пошук іде від файлу з імпортом, але для `-m` Python дивиться на поточну директорію. Варіант з `/proj`
    для другого запуску переносить правило `-m` на запуск шляхом. Порожній рядок дають лише `-c` і REPL,
    а не `-m`.

- id: p1
  type: project
  title: "CLI-модуль fieldid з кодами завершення"
  prompt: |
    У корені курсу створіть `practice/m0-l03/fieldid.py`: модуль, який одночасно бібліотека й CLI.

    - Функція `slugify(label: str) -> str` перетворює підпис поля на id: нижній регістр, слова через `_`
      (`"Email Address"` дає `"email_address"`).
    - Функція `main(argv: list[str] | None = None) -> int`: якщо `argv` не передали, бере `sys.argv`.
      Для кожного аргументу друкує його id окремим рядком у stdout.
    - Без аргументів: `usage: fieldid LABEL...` у stderr, код `2`.
    - Якщо id якогось підпису не є валідним ідентифікатором Python (`"9 lives"` дає `"9_lives"`), повідомлення в stderr
      і код `1`; валідні id при цьому все одно друкуються.
    - Внизу ідіома `if __name__ == "__main__": sys.exit(main())`. Імпорт модуля нічого не друкує.

    Запускається з директорії `practice/m0-l03` як `python -m fieldid "Email Address" Phone`.
    Перевірте коди через `echo $?` вручну, перш ніж запускати `verify`. `verify` запускається з кореня
    курсу: у підоболонці він додає `practice/m0-l03` у `PYTHONPATH`, і `-m fieldid` знаходить модуль так само,
    як при запуску з його папки.
  checklist:
    - "`python -m fieldid \"Email Address\" Phone` друкує `email_address` і `phone`, код 0"
    - "Без аргументів: usage у stderr, stdout порожній, код 2"
    - "`python -m fieldid \"9 lives\"`: повідомлення в stderr, код 1"
    - "`python -c \"import fieldid\"` нічого не друкує"
    - "`python -c \"import fieldid; print(fieldid.main(['fieldid', 'Age']))\"` друкує `age` і `0`: main можна викликати з коду, не лише з терміналу"
  verify: |
    (export PYTHONPATH=practice/m0-l03; P=.venv/bin/python \
      && test "$($P -m fieldid 'Email Address' Phone)" = "$(printf 'email_address\nphone')" \
      && { $P -m fieldid 2>/dev/null; test $? -eq 2; } \
      && test -z "$($P -m fieldid 2>/dev/null)" \
      && { $P -m fieldid '9 lives' 2>/dev/null; test $? -eq 1; } \
      && test -z "$($P -c 'import fieldid')" \
      && test "$($P -c "import fieldid; print(fieldid.main(['fieldid', 'Age']))")" = "$(printf 'age\n0')" \
      && echo OK)

- id: p2
  type: project
  title: "Пакет у src, який імпортується без хаків"
  prompt: |
    У `practice/m0-l03/src/formtools/` створіть пакет із трьох файлів:

    - `__init__.py` порожній;
    - `slug.py` з функцією `slugify` (можна перенести з p1);
    - `main.py`, який імпортує `slugify` абсолютним імпортом `from formtools.slug import slugify`,
      друкує id для кожного аргументу командного рядка і має guard з `main()`.

    Модуль має працювати двома способами: з директорії `src` як `python -m formtools.main "Email Address"`
    і з кореня курсу як `PYTHONPATH=practice/m0-l03/src python -m formtools.main "Email Address"`.
    Жодних `sys.path.insert` і `sys.path.append` у коді.

    Потім запустіть `python practice/m0-l03/src/formtools/main.py "Email Address"` з кореня курсу, отримайте
    `ModuleNotFoundError` і поясніть собі, яким був `sys.path[0]` у цьому запуску і чому там немає `formtools`.
    Правильне вирішення через встановлення пакета буде в m0-l06.

    `verify` запускається з кореня курсу: перевіряє запуск через `PYTHONPATH` і те, що запуск `main.py`
    шляхом справді падає (так буває лише з абсолютним імпортом `formtools.slug`).
  checklist:
    - "`cd practice/m0-l03/src && python -m formtools.main \"Email Address\"` друкує `email_address`"
    - "З кореня курсу `PYTHONPATH=practice/m0-l03/src python -m formtools.main \"Email Address\"` друкує те саме"
    - "У коді пакета немає маніпуляцій `sys.path`"
    - "Ви можете сказати, чому запуск `main.py` шляхом падає, а через `-m` працює"
  verify: |
    test "$(PYTHONPATH=practice/m0-l03/src .venv/bin/python -m formtools.main 'Email Address')" = email_address \
      && ! .venv/bin/python practice/m0-l03/src/formtools/main.py 'Email Address' >/dev/null 2>&1 \
      && ! grep -rq "sys\.path" practice/m0-l03/src \
      && echo OK
