- id: q1
  type: quiz
  question: |
    Новий термінал на Mac з уроку, ви поза будь-яким проєктом, `python3` у `PATH` це `/usr/bin/python3`.
    Що станеться після цієї команди?
    ```bash
    python3 -m pip install requests
    ```
  options:
    - "pip відмовить з `externally-managed-environment`: системний Python захищений PEP 668"
    - "Пакет ляже в `~/Library/Python/3.9` і стане видимим усім скриптам, які запускає системний `python3`"
    - "Пакет ляже в `site-packages` поточного каталогу, як `npm install` кладе `node_modules` поруч"
    - "Помилка `Permission denied`, без `sudo` нічого не встановиться"
  answer: 1
  explain: |
    Apple-івський 3.9 не має маркера `EXTERNALLY-MANAGED`, тому PEP 668 тут не спрацьовує: відмову
    ви побачите лише на Homebrew- або uv-Python. Системний `site-packages` належить `root`, але pip
    не падає з `Permission denied`, а сам перемикається на user-встановлення з повідомленням
    `Defaulting to user installation because normal site-packages is not writeable`. Локального
    каталогу пакетів поруч із проєктом pip не створює ніколи: для цього потрібне віртуальне оточення (m0-l02).
    Результат найгірший з чотирьох: тиха установка в спільне для всіх проєктів місце.

- id: t1
  type: code
  title: "Версія інтерпретатора з sys.version_info"
  prompt: |
    Це скрипт верхнього рівня, без функцій: лише `import sys`, `print` і `sys.version_info`
    з прикладу вище. Надрукуйте три рядки:

    1. major-версію інтерпретатора: поле `.major`, як у прикладі.
    2. Чи версія не старша за 3.10: порівняння `sys.version_info` з кортежем `(3, 10)`.
    3. Те саме для 4.0.

    Мінорну версію не друкуйте: у браузері платформи Python 3.13, а в `.venv` курсу 3.12,
    і завдання має проходити в обох. Очікуваний вивід:

    ```text
    3
    True
    False
    ```
  starter: |
    import sys

    # надрукуйте major, потім дві перевірки версії
  harness: ""
  expected: |
    3
    True
    False
  hints:
    - "Усе потрібне є в живому прикладі над завданням: поле .major та порівняння з кортежем."
    - "Перший рядок це print(sys.version_info.major)."
    - "Два наступні рядки: print(sys.version_info >= (3, 10)) і print(sys.version_info >= (4, 0))."
  solution: |
    import sys

    print(sys.version_info.major)
    print(sys.version_info >= (3, 10))
    print(sys.version_info >= (4, 0))
  requires: []
  runtime: browser

- id: q2
  type: quiz
  question: |
    На Mac з уроку ви виконали `uv python install 3.12`, відкрили новий термінал і перебуваєте
    поза будь-яким проєктом. `PATH` той самий: `~/.local/bin`, потім `/usr/bin`, потім `/opt/homebrew/bin`.
    Що надрукує ця команда?
    ```bash
    python3 --version
    ```
  options:
    - "Python 3.12.12"
    - "Python 3.9.6"
    - "Python 3.14.5"
    - "zsh: command not found: python3"
  answer: 1
  explain: |
    uv кладе в `~/.local/bin` лише версійне посилання `python3.12`, а `python3` не чіпає, тому перший
    `python3` у `PATH` лишається Apple-івським у `/usr/bin`. 3.12.12 ви отримаєте через `python3.12`
    або `uv run python`, але uv не перемикає версію для shell, як `nvm use`. 3.14.5 з Homebrew теж
    називається `python3`, але `/opt/homebrew/bin` стоїть у `PATH` пізніше за `/usr/bin`. "Command not
    found" це доля команди `python`, а не `python3`.

- id: q3
  type: quiz
  question: |
    Та сама машина: Apple-івський 3.9.6 перший у `PATH` як `python3`, Homebrew 3.14.5 далі в `PATH`,
    uv-керовані 3.10.19 і 3.12.12. Ви в каталозі без `.python-version` і без `pyproject.toml`.
    Що надрукує ця команда?
    ```bash
    uv run python --version
    ```
  options:
    - "Python 3.9.6"
    - "Python 3.14.5"
    - "Python 3.12.12"
    - "Python 3.10.19"
  answer: 2
  explain: |
    Без прапорця `--python` і без конфігу проєкту uv за замовчуванням віддає перевагу своїм керованим
    версіям перед тим, що лежить у `PATH`, і з них бере найновішу, тобто 3.12.12. Перший `python3` у `PATH`
    (3.9.6) важливий для shell, а не для uv. Найновіший 3.14.5 з Homebrew теж не вибирається:
    "найновіший взагалі" не правило uv, керовані версії йдуть першими. 3.10.19 керована, але старша за 3.12.12.

- id: q4
  type: quiz
  question: |
    У каталозі проєкту `.python-version` містить `3.10`, а `pyproject.toml` такий:
    ```toml
    [project]
    name = "versions-demo"
    version = "0.1.0"
    requires-python = ">=3.12"
    ```
    На машині встановлені 3.10.19 і 3.12.12. Що зробить `uv run python --version`?
  options:
    - "Надрукує `Python 3.10.19` і попередження про несумісність, як npm з `engines`"
    - "Мовчки візьме 3.12.12, бо `requires-python` важливіший за `.python-version`"
    - "Завершиться помилкою про конфлікт `.python-version` з `requires-python`, Python не запуститься"
    - "Завантажить ще одну 3.10, бо в `.python-version` вказана версія без patch-номера"
  answer: 2
  explain: |
    uv бере інтерпретатор з `.python-version`, бачить, що 3.10.19 не задовольняє `>=3.12`, і зупиняється
    з `error: The Python request from .python-version resolved to Python 3.10.19, which is incompatible
    with the project's Python requirement`. Це не warning, як `engines` у npm: код не запускається взагалі.
    Тихо підмінити версію uv теж не стане, бо `.python-version` це ваше явне рішення, і суперечність
    треба розв'язати руками через `uv python pin 3.12`. `3.10` без patch-номера означає "будь-яка 3.10",
    і встановлена 3.10.19 під це підходить, тож нічого не завантажується.

- id: q5
  type: quiz
  question: |
    Що надрукує цей рядок?
    ```python
    print("3.9.6" >= "3.12", (3, 9, 6) >= (3, 12))
    ```
  options:
    - "True False"
    - "False False"
    - "True True"
    - "TypeError: кортежі різної довжини не порівнюються"
  answer: 0
  explain: |
    Рядки порівнюються посимвольно: `"3"` і `"."` збігаються, далі `"9"` проти `"1"`, і `"9"` більше,
    тому `"3.9.6" >= "3.12"` дає `True`, хоча 3.9 старша за 3.12. Саме цю помилку дає звичка порівнювати
    версії рядками, як `"3.10" >= "3.9"` у JS. Кортежі порівнюються поелементно: `3 == 3`, далі `9 < 12`,
    і результат `False` визначено вже на другому елементі, третій `6` не розглядається. Різна довжина
    кортежів не помилка: коротший зі спільним префіксом просто менший, як `(3, 12) < (3, 12, 1)` у прикладі.
    `False False` вийшло б, якби рядки порівнювались як числа частинами, але так поводиться лише кортеж.

- id: p1
  type: project
  title: "Скрипт, що не залежить від python3 у PATH"
  prompt: |
    Створіть у корені курсу каталог `practice/m0-l01/` і в ньому виконуваний файл
    `pyinfo.py`, який друкує реалізацію й версію інтерпретатора, наприклад `CPython 3.12.12`.

    Скрипт має запускатися як `./pyinfo.py` з будь-якого каталогу й щоразу потрапляти в 3.12,
    незалежно від того, що лежить у `PATH` під іменем `python3`. Для цього shebang з uv і блок
    `# /// script` з `requires-python = "==3.12.*"`.

    Окремо: якщо хтось запустить файл старим інтерпретатором напряму (`/usr/bin/python3 pyinfo.py`),
    скрипт має завершитись ненульовим кодом і повідомленням `need Python 3.12+, got <версія>`,
    а не надрукувати версію 3.9. Подумайте, чому ця перевірка спрацює лише доти, доки файл
    синтаксично сумісний із 3.9.

    `verify` запускається з кореня курсу і викликає скрипт шляхом `practice/m0-l01/pyinfo.py`.
  checklist:
    - "Перший рядок `#!/usr/bin/env -S uv run --script`, файл має право на виконання (`chmod +x`)"
    - "Блок `# /// script` з `requires-python = \"==3.12.*\"`"
    - "`./pyinfo.py` друкує `CPython 3.12.` і patch-номер, у тому числі якщо запустити його з `/`"
    - "`/usr/bin/python3 pyinfo.py` завершується з ненульовим кодом через `sys.exit` з повідомленням"
    - "Версія в повідомленні береться з `platform.python_version()` або `sys.version_info`, а не пишеться руками"
  verify: "practice/m0-l01/pyinfo.py | grep -E '^CPython 3\\.12\\.' && ! /usr/bin/python3 practice/m0-l01/pyinfo.py"

- id: p2
  type: project
  title: "Пісочниця з закріпленою версією"
  prompt: |
    У тому самому каталозі `practice/m0-l01/` зробіть його проєктом з закріпленим Python 3.12
    (усі команди нижче виконуються з цього каталогу):

    1. `uv python pin 3.12`, щоб з'явився `.python-version`.
    2. Руками (без `uv init`, він з m0-l02) створіть `pyproject.toml` з секцією `[project]`:
       `name = "m0-l01-sandbox"`, `version = "0.1.0"`, `requires-python = ">=3.12"`.
    3. Файл `check.py`, який друкує `platform.python_implementation()` і версію з `sys.version`
       через пробіл, наприклад `CPython 3.12.12`.
    4. Запустіть `uv run python check.py`. Після першого запуску в каталозі з'являться `.venv` і `uv.lock`,
       це очікувано, детально в m0-l02.

    Потім перевірте суперечність руками: поставте в `.python-version` значення `3.10` (через редактор,
    бо `uv python pin 3.10` уже відмовить), запустіть `uv run python check.py`, прочитайте помилку
    і поверніть `3.12`.

    Завдання про uv, тому `verify` переходить у каталог проєкту (`cd practice/m0-l01`) і запускає
    `uv run`, а не `.venv/bin/python` з кореня курсу: потрібне оточення цього проєкту, а не курсу.
  checklist:
    - "`.python-version` містить рівно `3.12`"
    - "`pyproject.toml` має `requires-python = \">=3.12\"`"
    - "`uv run python check.py` друкує `CPython 3.12.` і patch-номер"
    - "Ви бачили помилку uv про несумісність `.python-version` і `requires-python` і можете пояснити, хто з них за що відповідає"
  verify: "cd practice/m0-l01 && test \"$(cat .python-version)\" = \"3.12\" && grep -q 'requires-python = \">=3.12\"' pyproject.toml && uv run python check.py | grep -E '^CPython 3\\.12\\.'"
