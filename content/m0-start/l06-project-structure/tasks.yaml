- id: q1
  type: quiz
  question: |
    Flat layout, `pyproject.toml` на setuptools з `packages = ["formbuilder"]`, а код рендера лежить
    у підпакеті `formbuilder/render/`. Пакет встановлено звичайним (не editable) встановленням: `uv sync --no-editable`.
    З кореня проєкту запускають `.venv/bin/python -m pytest -q`, тест робить `from formbuilder.render import render`.
    Що відбудеться?
  options:
    - "Тест пройде: імпортується локальна папка `formbuilder/`, де `render/` є"
    - "`ModuleNotFoundError: No module named 'formbuilder.render'`, бо у встановленому пакеті підпакета немає"
    - "pytest попередить, що локальна папка затіняє встановлений пакет, і тест пройде"
    - "`ImportError: attempted relative import with no known parent package`"
  answer: 0
  explain: |
    `python -m` ставить поточну директорію першою в `sys.path`, тому `import formbuilder` знаходить папку в корені
    раніше за `site-packages`. Тест проходить, хоча встановлений пакет зламаний: `packages = ["formbuilder"]`
    не включає підпакети, і у wheel лежить лише `formbuilder/__init__.py`.
    `ModuleNotFoundError` ви отримали б у src layout: там у корені немає папки `formbuilder/`, імпорт іде у
    `site-packages`, і помилка пакування стає червоним тестом. Саме в цьому аргумент за src layout.
    Ніякого попередження про затінення pytest не дає, він не знає, який із двох `formbuilder` ви мали на увазі.
    Відносних імпортів у сценарії немає, тож ця помилка тут ні до чого.

- id: q2
  type: quiz
  question: |
    У капстоуні після `uv sync` ви міняєте в `pyproject.toml` рядок на `version = "0.2.0"` і одразу, без `uv sync`, запускаєте:
    ```bash
    .venv/bin/python -c "from importlib.metadata import version; print(version('formbuilder'))"
    ```
    Що надрукується?
  options: ["0.1.0", "0.2.0", "PackageNotFoundError: formbuilder", "0.2.0 і попередження про застарілий lockfile"]
  answer: 0
  explain: |
    `importlib.metadata` читає не `pyproject.toml`, а файл `METADATA` у `.venv/lib/python3.12/site-packages/formbuilder-0.1.0.dist-info/`,
    який з'явився під час встановлення. Editable install робить живим лише код у `src/`, а метадані (версія,
    entry points, залежності) фіксуються в момент встановлення. Оновить їх `uv sync` або будь-який `uv run`,
    який сам помітить зміну `pyproject.toml` і перевстановить пакет.
    `0.2.0` це очікування з JS, де `require("./package.json").version` читає файл напряму.
    `PackageNotFoundError` був би, якби пакет взагалі не встановлювали. Прямий виклик `.venv/bin/python` нічого
    не знає про lockfile, тому й попереджати нема кому.

- id: q3
  type: quiz
  question: |
    `[project.scripts] formbuilder = "formbuilder.cli:main"`, і `main` написана за JS-звичкою "повернути, чи вдалося":
    ```python
    def main() -> bool:
        print("built")
        return True
    ```
    Що покаже `uv run formbuilder; echo $?`?
  options: ["built і 1", "built і 0", "built, True і 0", "TypeError: exit code must be int"]
  answer: 0
  explain: |
    Згенерований скрипт робить `sys.exit(main())`. `True` у Python це `int` зі значенням 1, а ненульовий код
    виходу в shell означає помилку: CI вважатиме успішну збірку провалом.
    `0` вийшов би при `return None` або `return 0`. Рядок `True` друкується лише тоді, коли в `sys.exit` передали
    не число, а рядок чи інший об'єкт (і тоді код 1), але `bool` це підклас `int`, тож друку немає.
    `TypeError` немає: `sys.exit` приймає будь-що.
    Конвенція для `main`: повертати `int`, `0` при успіху.

- id: q4
  type: quiz
  question: |
    У `src/formbuilder/check.py` написано:
    ```python
    from .config import load

    print(load("form.json"))
    ```
    Пакет встановлено через `uv sync`, `config.py` поруч існує. Що дасть `uv run python src/formbuilder/check.py`?
  options:
    - "`ImportError: attempted relative import with no known parent package`"
    - "`{'source': 'form.json'}`, бо пакет встановлено"
    - "`ModuleNotFoundError: No module named 'formbuilder'`"
    - "Спрацює лише після додавання `src/__init__.py`"
  answer: 0
  explain: |
    Запущений за шляхом файл стає модулем `__main__` без батьківського пакета, а відносний імпорт рахується
    від пакета поточного модуля. Пакета немає, тому `.config` нема від чого рахувати. Те, що `formbuilder`
    встановлено, не допомагає: інтерпретатор не знає, що цей файл і є `formbuilder.check`.
    `uv run python -m formbuilder.check` або абсолютний `from formbuilder.config import load` дають
    `{'source': 'form.json'}`. `ModuleNotFoundError` був би при абсолютному імпорті без встановленого пакета.
    `src/__init__.py` зробив би пакетом `src`, а не допоміг: `src` у src layout не пакет, а лише папка.

- id: q5
  type: quiz
  question: |
    Пакет `formbuilder` у src layout встановлено через `uv sync`. Яке ім'я модуля (`__name__`, як у m0-l03)
    отримають при імпорті ці два файли?
    ```text
    src/formbuilder/cli.py
    src/formbuilder/config/__init__.py
    ```
  options:
    - "`formbuilder.cli` і `formbuilder.config`"
    - "`src.formbuilder.cli` і `src.formbuilder.config`"
    - "`formbuilder.cli` і `formbuilder.config.__init__`"
    - "`cli` і `config`"
  answer: 0
  explain: |
    Правило src layout механічне: відкинути `src/` і `.py`, слеші стають крапками, а `__init__.py` означає
    саму папку-пакет. Тому `config/__init__.py` це модуль `formbuilder.config`, і `import formbuilder.config`
    виконує саме цей файл. `src` не пакет, а лише папка, яка не входить в ім'я: імпорт іде зі встановленого
    пакета, а не від кореня репозиторію, як шлях у JS-імпорті. `cli` і `config` без префікса це інтуїція
    "ім'я файлу і є модуль", але в пакеті ім'я модуля завжди повне, від кореневого пакета.

- id: q6
  type: quiz
  question: |
    У `pyproject.toml` стоїть `testpaths = ["tests"]`, а в `tests/` чотири файли з такими функціями:
    ```text
    tests/test_smoke.py   helper, test_package_is_installed_and_cli_runs
    tests/conftest.py     test_like_fixture
    tests/helpers.py      test_like_name
    tests/render_test.py  test_render, check_layout
    ```
    Що надрукує `uv run pytest --collect-only -q` перед рядком з кількістю тестів?
  options:
    - "`tests/render_test.py::test_render` і `tests/test_smoke.py::test_package_is_installed_and_cli_runs`"
    - "Лише `tests/test_smoke.py::test_package_is_installed_and_cli_runs`"
    - "Чотири node id: усі функції з префіксом `test` у всіх файлах `tests/`"
    - "Чотири node id: усі функції з `test_smoke.py` і `render_test.py`, включно з `helper` і `check_layout`"
  answer: 0
  explain: |
    pytest збирає файли `test_*.py` і `*_test.py`, а в них лише функції з префіксом `test`. `render_test.py`
    підходить під другий шаблон, тож `test_render` зібрано, а `check_layout` ні. Варіант лише з `test_smoke.py`
    забуває про суфіксний шаблон `*_test.py`, звичний з Jest як `*.test.ts`. `conftest.py` і `helpers.py`
    під жоден шаблон імені файлу не підпадають, тому їхні функції не тести, хоч і починаються з `test`.
    А всі функції підряд з тестового файлу pytest не бере: `helper` лишається звичайною функцією.

- id: p1
  type: project
  title: "Скелет капстоуну formbuilder"
  prompt: |
    Створіть у корені курсу папку `capstone/` з проєктом `formbuilder` у src layout. Це репозиторій, у який модулі 2–7
    додаватимуть код, тож структура має бути саме такою:

    ```text
    capstone/
    ├── .gitignore
    ├── .python-version          # 3.12
    ├── README.md                # що це і як запустити
    ├── pyproject.toml
    ├── uv.lock
    ├── src/formbuilder/
    │   ├── __init__.py          # __version__ з importlib.metadata
    │   ├── __main__.py          # python -m formbuilder
    │   └── cli.py               # main(argv=None) -> int
    └── tests/
        └── test_smoke.py
    ```

    Почніть з `uv init --package --vcs none --python 3.12 --name formbuilder capstone`, потім
    `uv add --dev pytest ruff mypy`. Далі руками: `[project.scripts]` на `formbuilder.cli:main`,
    конфіги `[tool.ruff]`, `[tool.pytest.ini_options]`, `[tool.mypy]` в `pyproject.toml`, `cli.py` з рішення t3
    (версію брати з `formbuilder.__version__`), `__main__.py`, один smoke-тест.
    Звірте свій результат з еталоном у `capstone/` курсу.
  checklist:
    - "`uv sync` на чистій копії (без `.venv/`) створює оточення і ставить `formbuilder` в editable-режимі"
    - "`uv run python -c \"import formbuilder; print(formbuilder.__file__)\"` з будь-якої папки друкує шлях у `src/formbuilder/`"
    - "`uv run pytest -q` збирає тести лише з `tests/` і проходить"
    - "`uv run ruff check` і `uv run ruff format --check` без зауважень, `uv run mypy src` у strict-режимі без помилок"
    - "`uv run formbuilder --help` друкує рядок usage і виходить з кодом 0; невідомий аргумент дає код 2 і текст у stderr"
    - "`uv run python -m formbuilder --version` друкує `formbuilder 0.1.0`, і ця версія ніде в коді не записана руками"
    - "У корені немає `formbuilder/`, `setup.py`, `requirements.txt` і `tests/__init__.py`; `.venv/` у `.gitignore`"
  verify: "cd capstone && uv sync && uv run pytest -q && uv run ruff check && uv run mypy src && uv run formbuilder --help"
