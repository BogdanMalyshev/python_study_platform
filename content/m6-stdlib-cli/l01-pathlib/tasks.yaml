  harness: |
    import tempfile
    from pathlib import Path

    with tempfile.TemporaryDirectory() as tmp:
        root = Path(tmp) / "forms"
        for rel in ["lead/old/v1.json", "contact.json", ".draft.json", "lead/form.json",
                    "_shared/base.json", "lead/theme.css", ".git/config.json",
                    "lead/_partial.json", "quiz/README.md"]:
