  title: "Нормалізація текстового файлу: BOM і CRLF"
  prompt: |
    Конфіги форм іноді приходять з Windows: з BOM на початку і з `\r\n` у кінці рядків.
    Напишіть `normalize_text_file(path)`, яка приводить файл до UTF-8 без BOM з кінцями рядків `\n`
    і повертає `True`, якщо файл довелося переписати, і `False`, якщо він уже був нормальним
    (тоді файл не перезаписується зовсім).

    ```python
    path.write_bytes(b"\xef\xbb\xbfa\r\nb\r\n")
    normalize_text_file(path)   # True
    path.read_bytes()           # b'a\nb\n'
    normalize_text_file(path)   # False
    ```

    Вхідні файли завжди в UTF-8 (з BOM або без), окремих `\r` без `\n` у них немає.
  starter: |
    from pathlib import Path


    def normalize_text_file(path: Path) -> bool:
        ...
  harness: |
    import codecs
    import tempfile
    from pathlib import Path

    with tempfile.TemporaryDirectory() as tmp:
        root = Path(tmp)
        windows = root / "windows.json"
        windows.write_bytes(codecs.BOM_UTF8 + '{"title": "Контакт"}\r\n'.encode())
        clean = root / "clean.json"
        clean.write_bytes('{"title": "Лід"}\n'.encode())
        crlf = root / "crlf.txt"
        crlf.write_bytes(b"a\r\nb\r\n")

        print(normalize_text_file(windows), windows.read_bytes())
        print(normalize_text_file(windows))
        print(normalize_text_file(clean), clean.read_text(encoding="utf-8"), end="")
        print(normalize_text_file(crlf), crlf.read_bytes())
  expected: |
    True b'{"title": "\xd0\x9a\xd0\xbe\xd0\xbd\xd1\x82\xd0\xb0\xd0\xba\xd1\x82"}\n'
    False
    False {"title": "Лід"}
    True b'a\nb\n'
  hints:
    - "Порівнювати треба байти: прочитайте файл як bytes, побудуйте нормалізовані bytes і записуйте лише тоді, коли вони відрізняються."
    - "Кодування utf-8-sig при декодуванні прибирає BOM, якщо він є, і нічого не робить, якщо його немає. Після цього лишається замінити '\\r\\n' на '\\n' і закодувати назад у utf-8."
    - "raw = path.read_bytes(); new = raw.decode(\"utf-8-sig\").replace(\"\\r\\n\", \"\\n\").encode(\"utf-8\"); if new == raw: return False; path.write_bytes(new); return True"
  solution: |
    from pathlib import Path


    def normalize_text_file(path: Path) -> bool:
        raw = path.read_bytes()
        normalized = raw.decode("utf-8-sig").replace("\r\n", "\n").encode("utf-8")
        if normalized == raw:
            return False
        path.write_bytes(normalized)
        return True
