  hints:
    - "rglob знаходить усе за шаблоном рекурсивно, включно з дотфайлами і директоріями. Решта фільтрів це умова в comprehension, а порядок дасть лише sorted."
    - "Для кожного знайденого p візьміть rel = p.relative_to(root): rel.parts дає частини шляху для перевірки startswith, а rel.as_posix() рядок для результату. Не забудьте p.is_file()."
    - "for path in root.rglob(\"*.json\"): rel = path.relative_to(root); пропустити, якщо not path.is_file() або any(part.startswith((\".\", \"_\")) for part in rel.parts); інакше result.append(rel.as_posix()). Наприкінці return sorted(result)."
  solution: |
    from pathlib import Path


    def find_configs(root: Path) -> list[str]:
        result = []
        for path in root.rglob("*.json"):
            rel = path.relative_to(root)
            if not path.is_file():
                continue
            if any(part.startswith((".", "_")) for part in rel.parts):
                continue
            result.append(rel.as_posix())
        return sorted(result)
