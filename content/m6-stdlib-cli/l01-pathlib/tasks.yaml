- id: t4
  type: code
  title: "Атомарний запис потоку байтів"
  prompt: |
    Рендерер віддає сторінку шматками через генератор і може впасти посередині.
    Напишіть `atomic_write_bytes(path, chunks)`, яка:

    - створює батьківські директорії `path`, якщо їх немає;
    - пише всі шматки з `chunks` у тимчасовий файл у тій самій директорії, що й `path`;
    - атомарно замінює ним `path` і повертає кількість записаних байтів;
    - якщо `chunks` кинув виняток, лишає попередній `path` без змін, не лишає тимчасових файлів
      і пропускає виняток далі.

    ```python
    atomic_write_bytes(index, iter([b"<main>", b"</main>"]))   # 13
    ```
  starter: |
    import os
    import tempfile
    from collections.abc import Iterable
    from pathlib import Path


    def atomic_write_bytes(path: Path, chunks: Iterable[bytes]) -> int:
        ...
  harness: |
    import tempfile
    from pathlib import Path

    def render(*parts: bytes, fail: bool = False):
        yield from parts
        if fail:
            raise RuntimeError("render failed")

    with tempfile.TemporaryDirectory() as tmp:
        root = Path(tmp)
        index = root / "out" / "contact" / "index.html"
        print(atomic_write_bytes(index, render(b"<main>", "Контакт".encode(), b"</main>")))
        print(index.read_text(encoding="utf-8"))
        try:
            atomic_write_bytes(index, render(b"<main>", b"half", fail=True))
        except RuntimeError as e:
            print("error:", e)
        print(index.read_text(encoding="utf-8"))
        print(atomic_write_bytes(index, []))
        print(repr(index.read_text(encoding="utf-8")))
        print(sorted(p.relative_to(root).as_posix() for p in root.rglob("*")))
  expected: |
    27
    <main>Контакт</main>
    error: render failed
    <main>Контакт</main>
    0
    ''
    ['out', 'out/contact', 'out/contact/index.html']
  hints:
    - "Рецепт з уроку: tempfile.mkstemp(dir=path.parent) дає дескриптор і ім'я тимчасового файлу поруч із ціллю; вміст пишеться туди, а Path.replace ставить файл на місце. Батьківські директорії треба створити ще до mkstemp."
    - "open(fd, \"wb\") загортає дескриптор у файловий об'єкт. Увесь запис і replace тримайте в try, а в except BaseException видаляйте тимчасовий файл через unlink(missing_ok=True) і робіть голий raise."
    - "path.parent.mkdir(parents=True, exist_ok=True); fd, name = tempfile.mkstemp(dir=path.parent, suffix=\".tmp\"); tmp = Path(name); try: with open(fd, \"wb\") as f: total = sum(f.write(c) for c in chunks); tmp.replace(path); return total; except BaseException: tmp.unlink(missing_ok=True); raise"
  solution: |
    import os
    import tempfile
    from collections.abc import Iterable
    from pathlib import Path


    def atomic_write_bytes(path: Path, chunks: Iterable[bytes]) -> int:
        path.parent.mkdir(parents=True, exist_ok=True)
        fd, name = tempfile.mkstemp(dir=path.parent, prefix=f".{path.name}.", suffix=".tmp")
        tmp = Path(name)
        try:
            total = 0
            with open(fd, "wb") as f:
                for chunk in chunks:
                    total += f.write(chunk)
                f.flush()
                os.fsync(f.fileno())
            tmp.replace(path)
        except BaseException:
            tmp.unlink(missing_ok=True)
            raise
        return total
  requires: []
  runtime: browser

- id: t5
  type: code
  title: "Синхронізація assets: rsync у мініатюрі"
  prompt: |
    Перед публікацією assets копіюються з `src` у `dst`, але копіювати все щоразу дорого.
    Напишіть `sync_tree(src, dst)`, яка робить `dst` дзеркалом `src` для файлів:

    - файл з `src`, якого немає в `dst` або який відрізняється розміром (`st_size`)
      чи часом зміни (`st_mtime_ns`), копіюється зі збереженням часу зміни; потрібні
      директорії створюються;
    - файл у `dst`, якого немає в `src`, видаляється;
    - решта файлів не чіпається;
    - файли, у відносному шляху яких є частина, що починається з `.`, ігноруються з обох боків:
      не копіюються, не видаляються і не потрапляють у звіт;
    - `dst` може ще не існувати.

    Повертає словник `{"copied": [...], "deleted": [...], "skipped": [...]}`, де кожен список
    відсортований і містить відносні шляхи з `/`. Порожні директорії в `dst` можна не прибирати.
  starter: |
    import shutil
    from pathlib import Path


    def sync_tree(src: Path, dst: Path) -> dict[str, list[str]]:
        ...
  harness: |
    import os
    import tempfile
    from pathlib import Path

    def put(path: Path, text: str, mtime: int = 1_700_000_000) -> None:
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(text, encoding="utf-8")
        os.utime(path, (mtime, mtime))

    with tempfile.TemporaryDirectory() as tmp:
        src, dst = Path(tmp) / "src", Path(tmp) / "dst"
        put(src / "index.html", "<main>")
        put(src / "assets" / "app.js", "init()")
        put(src / "assets" / "img" / "logo.svg", "<svg/>")
        put(src / ".DS_Store", "junk")
        print(sync_tree(src, dst))
        print(sync_tree(src, dst))

        put(src / "assets" / "app.js", "init(2)", mtime=1_700_000_100)
        (src / "assets" / "img" / "logo.svg").unlink()
        put(src / "assets" / "form.css", "form{}")
        put(src / "index.html", "<main>", mtime=1_700_000_200)
        put(dst / ".keep", "")
        print(sync_tree(src, dst))

        print(sorted(p.relative_to(dst).as_posix() for p in dst.rglob("*") if p.is_file()))
        app = dst / "assets" / "app.js"
        print(app.read_text(encoding="utf-8"), app.stat().st_mtime_ns == 1_700_000_100 * 10**9)
  expected: |
    {'copied': ['assets/app.js', 'assets/img/logo.svg', 'index.html'], 'deleted': [], 'skipped': []}
    {'copied': [], 'deleted': [], 'skipped': ['assets/app.js', 'assets/img/logo.svg', 'index.html']}
    {'copied': ['assets/app.js', 'assets/form.css', 'index.html'], 'deleted': ['assets/img/logo.svg'], 'skipped': []}
    ['.keep', 'assets/app.js', 'assets/form.css', 'index.html']
    init(2) True
  hints:
    - "Розбийте задачу на два словники 'відносний шлях -> Path': файли src і файли dst, обидва через rglob з фільтром is_file і без частин, що починаються з крапки. Далі це операції над ключами: що є лише в src, що лише в dst, що в обох."
    - "Порівняння двох файлів: a.stat() і b.stat(), поля st_size і st_mtime_ns. Копіювання з часом зміни це shutil.copy2, а перед ним target.parent.mkdir(parents=True, exist_ok=True). Видалення це unlink."
    - "def files(root): return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file() and not any(part.startswith('.') for part in p.relative_to(root).parts)} if root.exists() else {}. Потім цикл по sorted(src_files): якщо rel немає в dst_files або stat різний, copy2 у dst / rel; цикл по dst_files, яких немає в src_files: unlink."
  solution: |
    import shutil
    from pathlib import Path


    def _files(root: Path) -> dict[str, Path]:
        if not root.exists():
            return {}
        result = {}
        for path in root.rglob("*"):
            rel = path.relative_to(root)
            if path.is_file() and not any(part.startswith(".") for part in rel.parts):
                result[rel.as_posix()] = path
        return result


    def _same(a: Path, b: Path) -> bool:
        sa, sb = a.stat(), b.stat()
        return sa.st_size == sb.st_size and sa.st_mtime_ns == sb.st_mtime_ns


    def sync_tree(src: Path, dst: Path) -> dict[str, list[str]]:
        src_files, dst_files = _files(src), _files(dst)
        report: dict[str, list[str]] = {"copied": [], "deleted": [], "skipped": []}
        for rel in sorted(src_files):
            target = dst / rel
            if rel in dst_files and _same(src_files[rel], dst_files[rel]):
                report["skipped"].append(rel)
                continue
            target.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(src_files[rel], target)
            report["copied"].append(rel)
        for rel in sorted(dst_files.keys() - src_files.keys()):
            dst_files[rel].unlink()
            report["deleted"].append(rel)
        return report
  requires: []
  runtime: browser

- id: p1
  type: project
  title: "StaticPublisher у капстоуні"
  prompt: |
    У репозиторії капстоуну створіть `src/formbuilder/publisher.py` з класом `StaticPublisher`
    і тести до нього в `tests/test_publisher.py`. За основу візьміть клас з розділу "Для капстоуну".

    - `StaticPublisher(root: Path, keep: int = 3)`; корінь лише параметром, жодного `Path.cwd()`
