    Результат: відсортований список відносних шляхів від `root` з роздільником `/`.

    ```python
    find_configs(root)   # ['contact.json', 'lead/form.json', 'lead/old/v1.json']
    ```
  starter: |
    from pathlib import Path


    def find_configs(root: Path) -> list[str]:
