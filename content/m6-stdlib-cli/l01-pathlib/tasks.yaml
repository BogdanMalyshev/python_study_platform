    ```python
    cache_busted("assets/app.js", "a1b2c3")         # 'assets/app.a1b2c3.js'
    cache_busted("assets/vendor.min.js", "a1b2c3")  # 'assets/vendor.min.a1b2c3.js'
    cache_busted("favicon", "a1b2c3")               # 'favicon.a1b2c3'
    ```

    Розбирайте шлях через `pathlib`, а не через `split(".")`.
  starter: |
    from pathlib import PurePosixPath


    def cache_busted(path: str, digest: str) -> str:
        ...
  harness: |
    print(cache_busted("assets/app.js", "a1b2c3"))
    print(cache_busted("assets/vendor.min.js", "a1b2c3"))
    print(cache_busted("img/icons/logo.svg", "ff00"))
    print(cache_busted("favicon", "a1b2c3"))
    print(cache_busted("app.js", "0"))
  expected: |
    assets/app.a1b2c3.js
    assets/vendor.min.a1b2c3.js
    img/icons/logo.ff00.svg
    favicon.a1b2c3
    app.0.js
  hints:
    - "Потрібні три частини шляху: директорія, ім'я без останнього розширення і саме розширення. У Path усі три є атрибутами."
    - "p.stem і p.suffix дають 'vendor.min' і '.js'; нове ім'я склеюється f-рядком, а замінити ім'я в шляху вміє p.with_name(...)."
    - "p = PurePosixPath(path); return str(p.with_name(f\"{p.stem}.{digest}{p.suffix}\"))"
  solution: |
    from pathlib import PurePosixPath


    def cache_busted(path: str, digest: str) -> str:
        p = PurePosixPath(path)
