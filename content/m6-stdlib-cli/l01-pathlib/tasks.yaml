- id: q1
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    from pathlib import Path

    p = Path("dist/contact.tar.gz")
    print(p.stem, p.with_suffix(".zip").name)
    ```
  options:
    - "contact.tar contact.tar.zip"
    - "contact contact.zip"
    - "contact.tar contact.zip"
    - "contact contact.tar.zip"
  answer: 0
  explain: |
    `Path` вважає суфіксом лише частину після останньої крапки: `.suffix` дорівнює `.gz`, а `.stem`
    це все до неї, `contact.tar`. `with_suffix` замінює так само лише останній суфікс, тому виходить
    `contact.tar.zip`. Варіанти з `contact` і `contact.zip` відповідають інтуїції "розширення це все після
    першої крапки", яку `Path` не поділяє; повний список розширень дає `.suffixes`, `['.tar', '.gz']`.
    У Node `path.extname` поводиться так само, як `.suffix`, тож пастка тут не в Python, а в очікуванні
    "архівного" розширення.

- id: q2
  type: quiz
  question: |
    Що надрукує цей код на Linux або macOS?
    ```python
    from pathlib import Path

    root = Path("/srv/out")
    print(root / "/etc/passwd")
    ```
  options:
    - "/srv/out/etc/passwd"
    - "/etc/passwd"
    - "ValueError: абсолютний шлях не можна приєднати"
    - "/srv/out//etc/passwd"
  answer: 1
  explain: |
    Якщо праворуч від `/` абсолютний шлях, ліва частина відкидається повністю: так поводиться і
    `os.path.join`, і `path.resolve` у Node. `/srv/out/etc/passwd` це результат `path.join` у Node, який
    просто склеює сегменти, і саме ця інтуїція робить `root / user_input` небезпечним: користувач, що
    передав абсолютний шлях, виходить за корінь без жодного `..`. Помилки Python не кидає, а подвійних
    роздільників `Path` не лишає ніколи.

- id: q3
  type: quiz
  question: |
    Що надрукує цей код? Директорії `/srv/out` на диску може й не бути.
    ```python
    from pathlib import Path

    root = Path("/srv/out")
    target = root / "../secrets.json"
    print(target.is_relative_to(root), target.resolve().is_relative_to(root))
    ```
  options:
    - "True False"
    - "False False"
    - "True True"
    - "ValueError: шлях виходить за межі кореня"
  answer: 0
  explain: |
    `is_relative_to` порівнює частини шляху як текст і `..` не схлопує: `/srv/out/../secrets.json`
    починається з частин `/srv`, `out`, тому перша перевірка `True`. Лише `resolve()` перетворює шлях
    на `/srv/secrets.json`, і тоді перевірка чесно дає `False`. "False False" це очікування, що
    `is_relative_to` сам нормалізує шлях; на цьому й будуються path traversal-вразливості. Винятку немає:
    `is_relative_to` повертає `bool`, а `resolve()` у нестрогому режимі працює і для неіснуючих шляхів.

- id: t1
  type: code
