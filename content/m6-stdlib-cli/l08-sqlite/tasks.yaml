- id: q1
  type: quiz
  question: |
    Що станеться?
    ```python
    import sqlite3
    conn = sqlite3.connect(":memory:")
    conn.execute("CREATE TABLE forms (slug TEXT)")
    conn.execute("INSERT INTO forms VALUES ('signup')")
    rows = conn.execute("SELECT * FROM forms WHERE slug = ?", ("signup")).fetchall()
    print(rows)
    ```
  options:
    - "Надрукує `[('signup',)]`"
    - "`ProgrammingError`: запит чекає 1 параметр, а отримано 6"
    - "Надрукує `[]`: рядок порівнюється як `('signup')` разом з дужками"
    - "`OperationalError: near \"?\": syntax error`"
  answer: 1
  explain: |
    `("signup")` без коми це не кортеж, а рядок у дужках, як `(1 + 2)` це число. Рядок теж послідовність, тому
    `sqlite3` бачить шість значень, по одному на символ, і порівнює їх з одним плейсхолдером:
    `Incorrect number of bindings supplied. The current statement uses 1, and there are 6 supplied.`
    Перший варіант був би правильним з `("signup",)` або `{"slug": ...}` з `:slug`. Значення ніколи не
    підставляється в текст SQL, тож порівняння "разом з дужками" неможливе, а `syntax error` біля `?`
    буває лише тоді, коли плейсхолдер стоїть на місці імені таблиці чи колонки.

- id: q2
  type: quiz
  question: |
    Що надрукує код? Файл `app.db` порожній перед запуском.
    ```python
    import sqlite3
    with sqlite3.connect("app.db") as conn:
        conn.execute("CREATE TABLE jobs (id INTEGER PRIMARY KEY)")
        conn.execute("INSERT INTO jobs DEFAULT VALUES")
    print(conn.execute("SELECT count(*) FROM jobs").fetchone()[0])
    ```
  options:
    - "`1`"
    - "`ProgrammingError: Cannot operate on a closed database.`"
    - "`0`: без явного `commit()` вставка відкочена"
    - "`OperationalError: no such table: jobs`"
  answer: 0
  explain: |
    `with conn:` у `sqlite3` це транзакція, а не звільнення ресурсу: `__exit__` робить `commit()` (або `rollback()`
    при винятку) і лишає з'єднання відкритим. Тому після блоку запит працює і бачить закомічений рядок.
    `ProgrammingError` про закриту базу очікує той, хто переносить інтуїцію `with open(...)` або `using` з TS;
    для закриття потрібен `contextlib.closing`. `0` був би правильним, якби з'єднання закрили без `commit()` і
    без `with`. Таблиця теж існує: `CREATE TABLE` у legacy-режимі виконується одразу, поза транзакцією.

- id: q3
  type: quiz
  question: |
    Що надрукує код?
    ```python
    import json, sqlite3
    conn = sqlite3.connect(":memory:")
    conn.execute("CREATE TABLE forms (is_published BOOLEAN, config JSON)")
    conn.execute("INSERT INTO forms VALUES (?, ?)", (True, json.dumps({"id": "signup"})))
    flag, config = conn.execute("SELECT is_published, config FROM forms").fetchone()
    print(flag, type(config).__name__)
    ```
  options:
    - "`True dict`"
    - "`1 str`"
    - "`True str`"
    - "`1 dict`"
  answer: 1
  explain: |
    У SQLite немає типів `BOOLEAN` і `JSON`: це просто імена, які дають колонці affinity, а значення зберігається
    в одному з п'яти класів. `True` записується як ціле `1` і повертається як `int`; `json.dumps` дав рядок, і
    назад приходить рядок. Модуль не читає схему, щоб перетворити значення: варіанти з `True` і `dict` це
    очікування від ORM на кшталт Prisma з полями `Boolean` і `Json`. Розбирати значення треба явно:
    `bool(flag)`, `json.loads(config)`.

- id: q4
  type: quiz
  question: |
    З'єднання створене в головному потоці. Що станеться в цій корутині?
    ```python
    conn = sqlite3.connect("formbuilder.db")

    async def next_job():
        return await asyncio.to_thread(
            lambda: conn.execute("SELECT id FROM jobs WHERE status = 'queued' LIMIT 1").fetchone()
        )
    ```
  options:
    - "Спрацює: через GIL у кожен момент код виконує лише один потік, тож гонки немає"
    - "`ProgrammingError`: з'єднання можна використовувати лише в потоці, де його створили"
    - "`OperationalError: database is locked`, бо читають два потоки"
    - "Спрацює, але заблокує event loop на час запиту"
  answer: 1
  explain: |
    `to_thread` виконує функцію в потоці з пулу, а з'єднання за замовчуванням створене з `check_same_thread=True`
    і в чужому потоці кидає `ProgrammingError: SQLite objects created in a thread can only be used in that same thread`.
    GIL тут ні до чого: перевірку робить сам модуль. `database is locked` стосується двох writer-ів, а не читачів.
    Event loop якраз не блокується: для цього й потрібен `to_thread`. Виправлення: `check_same_thread=False`
    і один writer, або окреме з'єднання на виклик.

