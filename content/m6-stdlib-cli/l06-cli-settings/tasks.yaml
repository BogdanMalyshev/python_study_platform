- id: t1
  type: code
  title: "Парсер команди build"
  prompt: |
    Напишіть `build_parser()`, що повертає `argparse.ArgumentParser` з `prog="fb"` і такими аргументами:

    - позиційний `config`, тип `Path`;
    - `--out`, тип `Path`, за замовчуванням `Path("dist")`;
    - `--renderer` з вибором `html` або `text`, за замовчуванням `html`;
    - `--workers`, ціле число, за замовчуванням `4`;
    - `--dry-run` як прапорець без значення (`False`, якщо не вказаний);
    - `--tag`, який можна повторювати; значення збираються в список, за замовчуванням порожній.

    ```python
    vars(build_parser().parse_args(["a.json", "--tag", "x", "--tag", "y"]))
    # {'config': PosixPath('a.json'), 'out': PosixPath('dist'), 'renderer': 'html',
    #  'workers': 4, 'dry_run': False, 'tag': ['x', 'y']}
    ```

    Неприпустимий `--renderer` чи нечисловий `--workers` мають завершуватися так, як це робить argparse:
    `SystemExit` з кодом 2.
  starter: |
    import argparse
    from pathlib import Path


    def build_parser() -> argparse.ArgumentParser:
        ...
  harness: |
    import contextlib
    import io

    parser = build_parser()
    print(parser.prog)
    print(vars(parser.parse_args(["a.json"])))
    print(vars(parser.parse_args(["b.json", "--out", "public", "--renderer", "text", "--workers", "8", "--dry-run", "--tag", "x", "--tag", "y"])))
    for argv in (["a.json", "--renderer", "pdf"], ["a.json", "--workers", "many"], []):
        try:
            with contextlib.redirect_stderr(io.StringIO()):
                parser.parse_args(argv)
        except SystemExit as exc:
            print(argv, "->", exc.code)
  expected: |
    fb
    {'config': PosixPath('a.json'), 'out': PosixPath('dist'), 'renderer': 'html', 'workers': 4, 'dry_run': False, 'tag': []}
    {'config': PosixPath('b.json'), 'out': PosixPath('public'), 'renderer': 'text', 'workers': 8, 'dry_run': True, 'tag': ['x', 'y']}
    ['a.json', '--renderer', 'pdf'] -> 2
    ['a.json', '--workers', 'many'] -> 2
    [] -> 2
  hints:
    - "Позиційний аргумент оголошується іменем без дефісів, тип задає параметр type=, а повтор опції і прапорець без значення задаються параметром action=."
    - "choices=[\"html\", \"text\"] для рендерера, action=\"store_true\" для --dry-run, action=\"append\" з default=[] для --tag."
    - "parser.add_argument(\"config\", type=Path); parser.add_argument(\"--out\", type=Path, default=Path(\"dist\")); parser.add_argument(\"--workers\", type=int, default=4)."
  solution: |
    import argparse
    from pathlib import Path


    def build_parser() -> argparse.ArgumentParser:
        parser = argparse.ArgumentParser(prog="fb")
        parser.add_argument("config", type=Path)
        parser.add_argument("--out", type=Path, default=Path("dist"))
        parser.add_argument("--renderer", choices=["html", "text"], default="html")
        parser.add_argument("--workers", type=int, default=4)
        parser.add_argument("--dry-run", action="store_true")
        parser.add_argument("--tag", action="append", default=[])
        return parser
  requires: []
  runtime: browser

- id: t2
  type: code
  title: "Підкоманди build і validate"
  prompt: |
    Напишіть `build_parser()` для CLI з підкомандами (`prog="fb"`):

    - на головному парсері `-v`/`--verbose`, що рахує повтори (`-vv` дає `2`, за замовчуванням `0`);
    - підкоманда обов'язкова, її ім'я кладеться в атрибут `command`;
    - `build CONFIG [--out DIR]`, `--out` за замовчуванням `"dist"`;
    - `validate CONFIG [CONFIG ...] [--strict | --no-strict]`: один або більше конфігів у списку `configs`,
      `strict` за замовчуванням `True`, `--no-strict` вимикає.

    ```python
    vars(build_parser().parse_args(["-v", "validate", "a.json", "--no-strict"]))
    # {'verbose': 1, 'command': 'validate', 'configs': ['a.json'], 'strict': False}
    ```

    Виклик без підкоманди, `validate` без жодного конфігу і `-v` після підкоманди мають давати
    `SystemExit` з кодом 2.
  starter: |
    import argparse


    def build_parser() -> argparse.ArgumentParser:
        ...
  harness: |
    import contextlib
    import io

    parser = build_parser()
    print(vars(parser.parse_args(["build", "a.json"])))
    print(vars(parser.parse_args(["-vv", "build", "a.json", "--out", "public"])))
    print(vars(parser.parse_args(["validate", "a.json", "b.json"])))
    print(vars(parser.parse_args(["-v", "validate", "a.json", "--no-strict"])))
    for argv in ([], ["validate"], ["build", "a.json", "-v"]):
        try:
            with contextlib.redirect_stderr(io.StringIO()):
                parser.parse_args(argv)
        except SystemExit as exc:
            print(argv, "->", exc.code)
  expected: |
    {'verbose': 0, 'command': 'build', 'config': 'a.json', 'out': 'dist'}
    {'verbose': 2, 'command': 'build', 'config': 'a.json', 'out': 'public'}
    {'verbose': 0, 'command': 'validate', 'configs': ['a.json', 'b.json'], 'strict': True}
    {'verbose': 1, 'command': 'validate', 'configs': ['a.json'], 'strict': False}
    [] -> 2
    ['validate'] -> 2
    ['build', 'a.json', '-v'] -> 2
  hints:
    - "Підкоманди створює add_subparsers, а кожна підкоманда це окремий парсер зі своїми аргументами. Лічильник повторів і пара --x/--no-x це стандартні значення action=."
    - "sub = parser.add_subparsers(dest=\"command\", required=True); build = sub.add_parser(\"build\"); для validate nargs=\"+\"."
    - "parser.add_argument(\"-v\", \"--verbose\", action=\"count\", default=0); validate.add_argument(\"--strict\", action=argparse.BooleanOptionalAction, default=True)."
  solution: |
    import argparse


    def build_parser() -> argparse.ArgumentParser:
        parser = argparse.ArgumentParser(prog="fb")
        parser.add_argument("-v", "--verbose", action="count", default=0)
        sub = parser.add_subparsers(dest="command", required=True)

        build = sub.add_parser("build")
        build.add_argument("config")
        build.add_argument("--out", default="dist")

        validate = sub.add_parser("validate")
        validate.add_argument("configs", nargs="+")
        validate.add_argument("--strict", action=argparse.BooleanOptionalAction, default=True)
        return parser
  requires: []
  runtime: browser

- id: t3
  type: code
  title: "main(argv) -> int з кодами 0, 1, 2"
  prompt: |
    Напишіть `main(argv: list[str] | None = None) -> int` для команди `fb validate NAME [NAME ...]`.
    Парсер уже є в стартері.

    - Для кожного імені, що закінчується на `.json`, надрукувати в **stdout** `<name>: ok`.
    - Для решти надрукувати в **stderr** `fb: <name>: not a .json file`.
    - Повернути `0`, якщо всі імена валідні, і `1`, якщо хоча б одне ні. Перевіряються всі імена, не до першої помилки.
    - Помилка розбору аргументів повертає код argparse (`2`), а `--help` повертає `0`.
      `SystemExit` не має вилітати з `main` назовні.

    ```python
    main(["validate", "a.json", "b.yaml"])
    # stdout: a.json: ok
    # stderr: fb: b.yaml: not a .json file
    # -> 1
    ```
  starter: |
    import argparse
    import sys


    def build_parser() -> argparse.ArgumentParser:
        parser = argparse.ArgumentParser(prog="fb")
        sub = parser.add_subparsers(dest="command", required=True)
        validate = sub.add_parser("validate")
        validate.add_argument("names", nargs="+")
        return parser


    def main(argv: list[str] | None = None) -> int:
        ...
  harness: |
    import contextlib
    import io


    def run(argv):
        out, err = io.StringIO(), io.StringIO()
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
            code = main(argv)
        return code, out.getvalue(), err.getvalue()


    code, out, err = run(["validate", "a.json", "b.json"])
    print(code, repr(out), repr(err))
    code, out, err = run(["validate", "a.json", "b.yaml", "c.toml"])
    print(code, repr(out), repr(err))
    code, out, err = run(["validate"])
    print(code, repr(out), "usage" in err)
    code, out, err = run(["--help"])
    print(code, "usage: fb" in out, repr(err))
  expected: |
    0 'a.json: ok\nb.json: ok\n' ''
    1 'a.json: ok\n' 'fb: b.yaml: not a .json file\nfb: c.toml: not a .json file\n'
    2 '' True
    0 True ''
  hints:
    - "Розбір аргументів закінчується SystemExit і при помилці, і при --help; його можна перехопити й повернути його code."
    - "try: args = build_parser().parse_args(argv) except SystemExit as exc: return exc.code if isinstance(exc.code, int) else 2. Потім цикл з лічильником помилок."
    - "print(f\"fb: {name}: not a .json file\", file=sys.stderr); у кінці return 1 if failed else 0."
  solution: |
    import argparse
    import sys


    def build_parser() -> argparse.ArgumentParser:
        parser = argparse.ArgumentParser(prog="fb")
        sub = parser.add_subparsers(dest="command", required=True)
        validate = sub.add_parser("validate")
        validate.add_argument("names", nargs="+")
        return parser


    def main(argv: list[str] | None = None) -> int:
        try:
            args = build_parser().parse_args(argv)
        except SystemExit as exc:
            return exc.code if isinstance(exc.code, int) else 2
        failed = 0
        for name in args.names:
            if name.endswith(".json"):
                print(f"{name}: ok")
            else:
                print(f"fb: {name}: not a .json file", file=sys.stderr)
                failed += 1
        return 1 if failed else 0
  requires: []
  runtime: browser

- id: t4
  type: code
  title: "Типізоване читання оточення"
  prompt: |
    Напишіть `read_env(env: Mapping[str, str], prefix: str = "FORMBUILDER_") -> dict[str, object]`, яка читає
    три налаштування з переданого mapping (не з `os.environ`, щоб функцію можна було тестувати словником):

    | Змінна | Ключ результату | Тип | За замовчуванням |
    |---|---|---|---|
    | `<prefix>OUT_DIR` | `out_dir` | `str` | `"dist"` |
    | `<prefix>WORKERS` | `workers` | `int` | `4` |
    | `<prefix>DEBUG` | `debug` | `bool` | `False` |

    Правила:

    - Порожній рядок означає "не задано": береться значення за замовчуванням.
    - `debug` приймає без урахування регістру `1/true/yes/on` як `True` і `0/false/no/off` як `False`.
      Будь-що інше: `ValueError(f"{name}: expected a boolean, got {raw!r}")`, де `name` повне ім'я змінної.
    - `workers` нецілий: `ValueError(f"{name}: expected an integer, got {raw!r}")`.

    ```python
    read_env({"FORMBUILDER_DEBUG": "false", "FORMBUILDER_WORKERS": "8"})
    # {'out_dir': 'dist', 'workers': 8, 'debug': False}
    ```
  starter: |
    from collections.abc import Mapping


    def read_env(env: Mapping[str, str], prefix: str = "FORMBUILDER_") -> dict[str, object]:
        ...
  harness: |
    print(read_env({}))
    print(read_env({"FORMBUILDER_DEBUG": "false", "FORMBUILDER_WORKERS": "8"}))
    print(read_env({"FORMBUILDER_DEBUG": "YES", "FORMBUILDER_OUT_DIR": "/srv/out", "FORMBUILDER_WORKERS": ""}))
    print(read_env({"APP_DEBUG": "1", "FORMBUILDER_DEBUG": "nope"}, prefix="APP_"))
    for env in ({"FORMBUILDER_DEBUG": "enabled"}, {"FORMBUILDER_WORKERS": "4.5"}):
        try:
            read_env(env)
        except ValueError as exc:
            print("ValueError:", exc)
  expected: |
    {'out_dir': 'dist', 'workers': 4, 'debug': False}
    {'out_dir': 'dist', 'workers': 8, 'debug': False}
    {'out_dir': '/srv/out', 'workers': 4, 'debug': True}
    {'out_dir': 'dist', 'workers': 4, 'debug': True}
    ValueError: FORMBUILDER_DEBUG: expected a boolean, got 'enabled'
    ValueError: FORMBUILDER_WORKERS: expected an integer, got '4.5'
  hints:
    - "Значення з оточення завжди рядки: bool(\"false\") тут не допоможе, потрібні явні множини допустимих рядків. env.get(name) or None зводить порожній рядок до \"не задано\"."
    - "TRUE = {\"1\", \"true\", \"yes\", \"on\"}, FALSE = {\"0\", \"false\", \"no\", \"off\"}; порівнюйте raw.lower(). int(raw) кидає ValueError, його треба перехопити й кинути власний з потрібним текстом."
    - "try: workers = int(raw) except ValueError: raise ValueError(f\"{name}: expected an integer, got {raw!r}\") from None"
  solution: |
    from collections.abc import Mapping

    TRUE = {"1", "true", "yes", "on"}
    FALSE = {"0", "false", "no", "off"}


    def read_env(env: Mapping[str, str], prefix: str = "FORMBUILDER_") -> dict[str, object]:
        result: dict[str, object] = {"out_dir": "dist", "workers": 4, "debug": False}

        raw = env.get(f"{prefix}OUT_DIR") or None
        if raw is not None:
            result["out_dir"] = raw

        name = f"{prefix}WORKERS"
        raw = env.get(name) or None
        if raw is not None:
            try:
                result["workers"] = int(raw)
            except ValueError:
                raise ValueError(f"{name}: expected an integer, got {raw!r}") from None

        name = f"{prefix}DEBUG"
        raw = env.get(name) or None
        if raw is not None:
            if raw.lower() in TRUE:
                result["debug"] = True
            elif raw.lower() in FALSE:
                result["debug"] = False
            else:
                raise ValueError(f"{name}: expected a boolean, got {raw!r}")
        return result
  requires: []
  runtime: browser

- id: t5
  type: code
  title: "Шари налаштувань: CLI → env → defaults через Pydantic"
  prompt: |
    pydantic-settings у браузері недоступний, тож зберіть його механізм вручну зі звичайного Pydantic.
    Модель `Settings` дана. Напишіть `run(argv: list[str], env: Mapping[str, str]) -> int`:

    1. Розібрати `argv` парсером з `prog="fb"` і опціями `--out`, `--log-level`, `--workers`. **Усі три
       з `default=None`** і без `type=`: перетворення типів робить Pydantic. Значення `--out` має потрапити
       в поле `out_dir` (параметр `dest=`).
    2. Зі `env` взяти змінні з префіксом `FORMBUILDER_`, відрізати префікс, привести решту до нижнього
       регістру й лишити лише ті, що є полями моделі (`Settings.model_fields`). Інші змінні ігноруються.
    3. Злити шари: значення з `env` перекривають defaults моделі, а вказані в `argv` опції (не `None`)
       перекривають `env`.
    4. `Settings.model_validate(merged)`. Успіх: надрукувати в stdout `settings.model_dump()` і повернути `0`.
    5. `ValidationError`: для кожної помилки надрукувати в **stderr** рядок `fb: <поле>: <msg>` (поле з `err["loc"][0]`,
       повідомлення з `err["msg"]`) і повернути `2`.

    ```python
    run(["--workers", "8"], {"FORMBUILDER_WORKERS": "2", "FORMBUILDER_OUT_DIR": "/srv"})
    # {'out_dir': '/srv', 'log_level': 'INFO', 'workers': 8}
    # -> 0
    ```
  starter: |
    import argparse
    import sys
    from collections.abc import Mapping
    from typing import Literal

    from pydantic import BaseModel, ConfigDict, Field, ValidationError

    PREFIX = "FORMBUILDER_"


    class Settings(BaseModel):
        model_config = ConfigDict(extra="forbid")

        out_dir: str = "dist"
        log_level: Literal["DEBUG", "INFO", "WARNING", "ERROR"] = "INFO"
        workers: int = Field(default=4, ge=1)


    def run(argv: list[str], env: Mapping[str, str]) -> int:
        ...
  harness: |
    import contextlib
    import io


    def call(argv, env):
        err = io.StringIO()
        with contextlib.redirect_stderr(err):
            code = run(argv, env)
        print("->", code, repr(err.getvalue()))


    call([], {})
    call([], {"FORMBUILDER_WORKERS": "2", "FORMBUILDER_OUT_DIR": "/srv", "HOME": "/root", "FORMBUILDER_UNKNOWN": "x"})
    call(["--workers", "8", "--log-level", "DEBUG"], {"FORMBUILDER_WORKERS": "2", "FORMBUILDER_LOG_LEVEL": "ERROR"})
    call(["--out", "public"], {"FORMBUILDER_OUT_DIR": "/srv"})
    call([], {"FORMBUILDER_WORKERS": "0", "FORMBUILDER_LOG_LEVEL": "loud"})
    call(["--workers", "many"], {})
  expected: |
    {'out_dir': 'dist', 'log_level': 'INFO', 'workers': 4}
    -> 0 ''
    {'out_dir': '/srv', 'log_level': 'INFO', 'workers': 2}
    -> 0 ''
    {'out_dir': 'dist', 'log_level': 'DEBUG', 'workers': 8}
    -> 0 ''
    {'out_dir': 'public', 'log_level': 'INFO', 'workers': 4}
    -> 0 ''
    -> 2 "fb: log_level: Input should be 'DEBUG', 'INFO', 'WARNING' or 'ERROR'\nfb: workers: Input should be greater than or equal to 1\n"
    -> 2 'fb: workers: Input should be a valid integer, unable to parse string as an integer\n'
  hints:
    - "Шари це словники: спочатку з env, потім оновлення значеннями з CLI, які не None. Defaults дає сама модель для ключів, яких у словнику немає."
    - "from_env = {k[len(PREFIX):].lower(): v for k, v in env.items() if k.startswith(PREFIX)}, потім лишити ключі з Settings.model_fields; from_cli = {k: v for k, v in vars(args).items() if v is not None}."
    - "merged = {**from_env, **from_cli}; try: settings = Settings.model_validate(merged) except ValidationError as exc: for err in exc.errors(): print(f\"fb: {err['loc'][0]}: {err['msg']}\", file=sys.stderr); return 2"
  solution: |
    import argparse
    import sys
    from collections.abc import Mapping
    from typing import Literal

    from pydantic import BaseModel, ConfigDict, Field, ValidationError

    PREFIX = "FORMBUILDER_"


    class Settings(BaseModel):
        model_config = ConfigDict(extra="forbid")

        out_dir: str = "dist"
        log_level: Literal["DEBUG", "INFO", "WARNING", "ERROR"] = "INFO"
        workers: int = Field(default=4, ge=1)


    def run(argv: list[str], env: Mapping[str, str]) -> int:
        parser = argparse.ArgumentParser(prog="fb")
        parser.add_argument("--out", dest="out_dir", default=None)
        parser.add_argument("--log-level", default=None)
        parser.add_argument("--workers", default=None)
        args = parser.parse_args(argv)

        from_env = {
            name[len(PREFIX):].lower(): value
            for name, value in env.items()
            if name.startswith(PREFIX)
        }
        from_env = {k: v for k, v in from_env.items() if k in Settings.model_fields}
        from_cli = {k: v for k, v in vars(args).items() if v is not None}

        try:
            settings = Settings.model_validate({**from_env, **from_cli})
        except ValidationError as exc:
            for err in exc.errors():
                print(f"fb: {err['loc'][0]}: {err['msg']}", file=sys.stderr)
            return 2
        print(settings.model_dump())
        return 0
  requires: [pydantic]
  runtime: browser

- id: q1
  type: quiz
  question: |
    Процес запущено як `FORMBUILDER_DEBUG=false python app.py`. Що надрукує цей рядок?
    ```python
    print(bool(os.getenv("FORMBUILDER_DEBUG", False)))
    ```
  options: ["True", "False", "ValueError: invalid truth value 'false'", "'false'"]
  answer: 0
  explain: |
    Змінні оточення завжди рядки, тож `getenv` повертає `"false"`, а будь-який непорожній рядок truthy:
    `bool("false")` це `True`. `False` як default спрацював би лише за відсутності змінної, а тут вона є.
    `ValueError` спокушає тих, хто пам'ятає `distutils.util.strtobool`, але `bool()` рядків не розбирає і нічого
    не кидає. `'false'` надрукував би `repr` самого значення, без `bool`. Правильний розбір: явна множина
    допустимих значень або поле `debug: bool` у pydantic-settings, яке перетворює `"false"` на `False`.

- id: q2
  type: quiz
  question: |
    Що станеться на останньому рядку?
    ```python
    parser = argparse.ArgumentParser(prog="fb")
    parser.add_argument("-v", "--verbose", action="count", default=0)
    sub = parser.add_subparsers(dest="command", required=True)
    sub.add_parser("build").add_argument("config")

    parser.parse_args(["build", "a.json", "-v"])
    ```
  options:
    - "Повернеться `Namespace(verbose=1, command='build', config='a.json')`"
    - "Повернеться `Namespace(verbose=0, command='build', config='a.json')`: `-v` проігноровано"
    - "У stderr `fb: error: unrecognized arguments: -v`, потім `SystemExit` з кодом 2"
    - "Буде кинуто `argparse.ArgumentError`, який можна перехопити `except Exception`"
  answer: 2
  explain: |
    Після імені підкоманди решту `argv` розбирає підпарсер `build`, а він про `-v` не знає. Головний парсер
    бачить нерозібраний залишок і завершується через `parser.error`: usage і повідомлення в stderr, `sys.exit(2)`.
    Перший варіант це поведінка commander/yargs, де глобальні опції працюють у будь-якій позиції. Тихого
    ігнорування argparse не робить: невідомий аргумент завжди помилка. `ArgumentError` з'являється лише з
    `exit_on_error=False`, а за замовчуванням виходить `SystemExit`, який `except Exception` не ловить, бо
    успадковує `BaseException`.

- id: q3
  type: quiz
  question: |
    `Settings` має `env_prefix="FORMBUILDER_"`, `env_file=".env"` і поле `out_dir: str = "dist"`.
    В оточенні `FORMBUILDER_OUT_DIR=/env`, у файлі `.env` рядок `FORMBUILDER_OUT_DIR=/dotenv`.
    Що надрукує код?
    ```python
    print(Settings(out_dir="/cli").out_dir, Settings().out_dir)
    ```
  options: ["/cli /env", "/cli /dotenv", "/env /env", "/cli dist"]
  answer: 0
  explain: |
    Пріоритет джерел pydantic-settings: аргументи конструктора, змінні оточення, `.env`, секрети, defaults.
    Аргумент конструктора перемагає все, тому `/cli`. Без нього виграє оточення, бо реальне оточення сильніше
    за файл, як і в `load_dotenv` без `override=True`. `/dotenv` обрав би той, хто думає, що `.env` "свіжіший"
    за shell. `/env /env` означав би, що env сильніший за явний аргумент, і тоді CLI-прапорець ніколи не міг би
    перекрити змінну оточення. `dist` означав би, що `.env` і оточення ігноруються без явного завантаження,
    але `env_file` у `model_config` якраз і є цим завантаженням.

- id: q4
  type: quiz
  question: |
    Як Typer відобразить у CLI параметр `dry_run` цієї команди?
    ```python
    @app.command()
    def build(config: Path, dry_run: bool = False) -> None: ...
    ```
  options:
    - "Пара прапорців `--dry-run/--no-dry-run`, за замовчуванням вимкнено"
    - "Опція зі значенням: `--dry_run true`"
    - "Другий позиційний аргумент, як `config`"
    - "Опція `--dry-run VALUE`, де значення перетворюється через `bool(VALUE)`"
  answer: 0
  explain: |
    Параметр зі значенням за замовчуванням стає опцією, підкреслення в імені стають дефісами, а `bool`
    Typer перетворює на пару прапорців без значення, як `BooleanOptionalAction` в argparse. Позиційним
    аргументом стає лише параметр без значення за замовчуванням, тут це `config`. Варіант з `bool(VALUE)` це
    пастка `type=bool` з argparse, якої Typer якраз уникає. Ім'я з підкресленням Typer у CLI не залишає.

