    import subprocess
    from collections.abc import Sequence


    class ToolError(Exception):
        def __init__(self, argv: Sequence[str], returncode: int | None, detail: str) -> None:
            self.argv = list(argv)
            self.returncode = returncode
            self.detail = detail
            super().__init__(f"{self.argv[0]}: {detail}")


    def run_tool(
        argv: Sequence[str],
        *,
        input: str | None = None,
        timeout: float = 10.0,
        cwd: str | None = None,
    ) -> str:
        try:
            result = subprocess.run(
                list(argv),
                input=input,
                capture_output=True,
                encoding="utf-8",
                errors="replace",
                timeout=timeout,
                cwd=cwd,
            )
        except FileNotFoundError as e:
            raise ToolError(argv, None, f"not found: {e.filename}") from e
        except subprocess.TimeoutExpired as e:
            raise ToolError(argv, None, f"timed out after {timeout}s") from e
        if result.returncode != 0:
            tail = [line for line in result.stderr.splitlines() if line.strip()][-3:]
            raise ToolError(argv, result.returncode, f"exit {result.returncode}: " + " | ".join(tail))
        return result.stdout
