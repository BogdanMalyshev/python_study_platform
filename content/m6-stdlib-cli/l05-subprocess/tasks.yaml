    - "У render_one: `try: async with asyncio.timeout(timeout): out, err = await proc.communicate(data)` / `except TimeoutError: raise RuntimeError(...) from None` / `finally: if proc.returncode is None: proc.kill(); await proc.wait()`. У задачі render_all: `async with sem: try: pages[id] = await render_one(...) except (RuntimeError, OSError) as e: errors[id] = str(e)`."
  solution: |
    import asyncio
    import json
    from collections.abc import Sequence


    async def render_one(config: dict, argv: Sequence[str], timeout: float) -> str:
        proc = await asyncio.create_subprocess_exec(
            *argv,
            stdin=asyncio.subprocess.PIPE,
            stdout=asyncio.subprocess.PIPE,
            stderr=asyncio.subprocess.PIPE,
        )
        try:
            async with asyncio.timeout(timeout):
                out, err = await proc.communicate(json.dumps(config).encode())
        except TimeoutError:
            raise RuntimeError(f"timed out after {timeout}s") from None
        finally:
            if proc.returncode is None:
                proc.kill()
                await proc.wait()
        if proc.returncode != 0:
            lines = err.decode("utf-8", errors="replace").strip().splitlines()
            raise RuntimeError(f"exit {proc.returncode}: {lines[-1] if lines else ''}".rstrip())
        return out.decode("utf-8", errors="replace")


    async def render_all(
        configs: list[dict],
        argv: Sequence[str],
        *,
        limit: int = 2,
        timeout: float = 5.0,
    ) -> tuple[dict[str, str], dict[str, str]]:
        sem = asyncio.Semaphore(limit)
        pages: dict[str, str] = {}
        errors: dict[str, str] = {}

        async def job(config: dict) -> None:
            async with sem:
                try:
                    pages[config["id"]] = await render_one(config, argv, timeout)
                except (RuntimeError, OSError) as e:
                    errors[config["id"]] = str(e)

        async with asyncio.TaskGroup() as tg:
            for config in configs:
                tg.create_task(job(config))
        return pages, errors
