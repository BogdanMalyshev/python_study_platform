- id: q1
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    def total(prices: list[int]) -> int:
        return sum(prices)

    print(total([1.5, 2.5]))
    ```
  options:
    - "4.0"
    - "TypeError: expected list[int], got list[float]"
    - "4"
    - "Нічого: файл не запуститься, доки є помилка типів"
  answer: 0
  explain: |
    Інтерпретатор не перевіряє анотації: `list[int]` лежить у `total.__annotations__` і більше ні на що
    не впливає, тому `sum` спокійно додає float і повертає `4.0`. `TypeError` такого виду ніхто не генерує:
    для цього потрібна бібліотека на кшталт Pydantic, яка читає анотації сама. `4` міг би з'явитися лише
    за неявного приведення до `-> int`, а повернення теж не перевіряється. Варіант "не запуститься" це
    інтуїція з `tsc`, де помилка зупиняє збірку; mypy тут знайде помилку, але це окрема програма, і її
    вердикт на запуск не впливає.

- id: q2
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    def label(field_id: str, text: str | None) -> str:
        return text or field_id

    print(label("email"))
    ```
  options:
    - "email"
    - "None"
    - "TypeError: label() missing 1 required positional argument: 'text'"
    - "Порожній рядок"
  answer: 2
  explain: |
    `str | None` лише розширює тип значення, а необов'язковим параметр робить тільки значення за
    замовчуванням. Тут його немає, тому виклик з одним аргументом падає ще до входу в тіло. `email`
    вийшло б з `text: str | None = None`; це і є TS-інтуїція, де `text?: string` одночасно дозволяє
    пропустити аргумент. `None` і порожній рядок вимагали б, щоб Python підставив значення сам, а
    `undefined` у мові немає.

- id: t1
  type: code
  title: "Підпис поля: None проти порожнього рядка"
  prompt: |
    Напишіть `display_label(field_id, label=None)`, яка повертає підпис поля для UI:

    - якщо `label` не передано або передано `None`, підпис будується з `field_id`: підкреслення стають
      пробілами, перша літера велика (`"first_name"` дає `"First name"`);
    - якщо `label` це рядок, він повертається як є, **навіть порожній**: `""` у конфігу означає
      "підпис свідомо приховано", а не "підпису немає".

    Анотуйте функцію: `field_id` це рядок, `label` рядок або `None` і необов'язковий, результат рядок.
    Перевірка читає анотації через `get_type_hints`, тож вони мають бути саме такими.

    ```python
    display_label("first_name")        # 'First name'
    display_label("email", "E-mail")   # 'E-mail'
    display_label("email", "")         # ''
    ```
  starter: |
    def display_label(field_id, label=None):
        ...
  asserts: |
    import inspect
    from typing import get_type_hints

    assert display_label("email") == "Email", "без label: id з великої літери"
    assert display_label("first_name") == "First name", "підкреслення мають стати пробілами"
    assert display_label("email", None) == "Email", "None означає 'підпису немає', будуємо з id"
    assert display_label("email", "E-mail") == "E-mail", "переданий label повертається як є"
    assert display_label("email", "") == "", "порожній рядок це свідомо прихований підпис: перевіряйте `is None`, а не truthiness"
    hints = get_type_hints(display_label)
    assert hints == {"field_id": str, "label": str | None, "return": str}, f"анотації мають бути field_id: str, label: str | None, -> str; зараз {hints}"
    assert inspect.signature(display_label).parameters["label"].default is None, "label має бути необов'язковим: `= None`"
  hints:
    - "Порожній рядок і None обидва хибні, тому перевірка `if not label` їх не розрізнить. Потрібна перевірка саме на None."
    - "`if label is None:` і всередині `field_id.replace(\"_\", \" \").capitalize()`; анотація параметра `label: str | None = None`."
  solution: |
    def display_label(field_id: str, label: str | None = None) -> str:
        if label is None:
            return field_id.replace("_", " ").capitalize()
        return label
