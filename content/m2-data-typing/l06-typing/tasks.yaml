    2 1
  hints:
    - "tree_map і flatten рекурсивні: результат для вузла складається з результату для значення й результатів для кожної дитини. Сигнатури: `def tree_map[T, U](node: Node[T], fn: Callable[[T], U]) -> Node[U]` і `def flatten[T](node: Node[T]) -> list[T]`."
    - "`return {\"value\": fn(node[\"value\"]), \"children\": [tree_map(c, fn) for c in node[\"children\"]]}`; у flatten `result = [node[\"value\"]]` і `result.extend(flatten(c))` для кожної дитини."
    - "count_by_type: `for kind in flatten(tree_map(tree, lambda el: el[\"type\"])): counts[kind] = counts.get(kind, 0) + 1`, де `counts: dict[ElementType, int] = {}`."
  solution: |
    from collections.abc import Callable
    from typing import Literal, NotRequired, TypedDict

    type ElementType = Literal["form", "input", "text", "select"]

    class ElementConfig(TypedDict):
        id: str
        type: ElementType
        children: NotRequired[list["ElementConfig"]]

    class Node[T](TypedDict):
        value: T
        children: list["Node[T]"]

    def to_tree(el: ElementConfig) -> Node[ElementConfig]:
        return {"value": el, "children": [to_tree(c) for c in el.get("children", [])]}

    def tree_map[T, U](node: Node[T], fn: Callable[[T], U]) -> Node[U]:
        return {"value": fn(node["value"]), "children": [tree_map(c, fn) for c in node["children"]]}

    def flatten[T](node: Node[T]) -> list[T]:
        result = [node["value"]]
        for child in node["children"]:
            result.extend(flatten(child))
        return result

    def count_by_type(tree: Node[ElementConfig]) -> dict[ElementType, int]:
        counts: dict[ElementType, int] = {}
        for kind in flatten(tree_map(tree, lambda el: el["type"])):
            counts[kind] = counts.get(kind, 0) + 1
        return counts
  requires: []
  runtime: browser

