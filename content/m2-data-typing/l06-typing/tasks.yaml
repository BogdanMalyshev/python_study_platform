- id: t2
  type: code
  title: "Pydantic у мініатюрі: перевірка аргументів за анотаціями"
  prompt: |
    Напишіть `type_errors(func, values)`: вона читає анотації функції `func` через `typing.get_type_hints`
    і перевіряє словник `values` (ім'я параметра → значення) так, як це зробила б рантаймова бібліотека.

    - Ключі з `values`, для яких у `func` немає анотації, пропускаються.
    - Якщо анотація це `Literal[...]` (`typing.get_origin(hint) is Literal`), значення має бути одним
      з `typing.get_args(hint)`.
    - Інакше перевірка через `isinstance(value, hint)`: вона працює для звичайних класів і для `X | Y`.
    - Повертається список повідомлень у порядку ключів `values`, формат
      `"<ім'я>: unexpected <назва типу значення> <repr значення>"`.

    ```python
    def make_field(field_id: str, kind: Literal["input", "text"]) -> None: ...
    type_errors(make_field, {"field_id": 42, "kind": "input"})
    # ['field_id: unexpected int 42']
    ```
  starter: |
    from collections.abc import Callable
    from typing import Literal, get_args, get_origin, get_type_hints

    def type_errors(func: Callable[..., object], values: dict[str, object]) -> list[str]:
        ...
  harness: |
    def make_field(field_id: str, kind: Literal["input", "text"], max_length: int | None = None, note="") -> None:
        pass

    print(type_errors(make_field, {"field_id": "email", "kind": "input", "max_length": 255}))
    print(type_errors(make_field, {"field_id": 42, "kind": "checkbox", "max_length": "255"}))
    print(type_errors(make_field, {"max_length": None, "note": 3, "extra": 1}))
    print(make_field(42, "checkbox"))
  expected: |
    []
    ['field_id: unexpected int 42', "kind: unexpected str 'checkbox'", "max_length: unexpected str '255'"]
    []
    None
  hints:
    - "Спершу отримайте словник анотацій. Для кожної пари з values: немає анотації → далі; Literal → перевірка входження; решта → isinstance."
    - "`hints = get_type_hints(func)`; `hint = hints.get(name)`; для Literal `ok = value in get_args(hint)`, інакше `ok = isinstance(value, hint)`; повідомлення `f\"{name}: unexpected {type(value).__name__} {value!r}\"`."
  solution: |
    from collections.abc import Callable
    from typing import Literal, get_args, get_origin, get_type_hints

    def type_errors(func: Callable[..., object], values: dict[str, object]) -> list[str]:
        hints = get_type_hints(func)
        errors: list[str] = []
        for name, value in values.items():
            if name not in hints:
                continue
            hint = hints[name]
            if get_origin(hint) is Literal:
                ok = value in get_args(hint)
            else:
                ok = isinstance(value, hint)
            if not ok:
                errors.append(f"{name}: unexpected {type(value).__name__} {value!r}")
        return errors
  requires: []
  runtime: browser

- id: q3
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    from typing import TypedDict

    class FieldConfig(TypedDict):
        id: str
        required: bool

    cfg = FieldConfig(id="email", required="yes")
    print(type(cfg).__name__, cfg["required"])
    ```
  options:
    - "dict yes"
    - "FieldConfig yes"
    - "FieldConfig True"
    - "TypeError: required must be bool"
  answer: 0
  explain: |
    TypedDict не створює класу в рантаймі: виклик `FieldConfig(...)` повертає звичайний `dict` з тими
    самими ключами й значеннями, без перевірки й без перетворення. Тому тип `dict`, а `"yes"` лишається
    рядком. `FieldConfig` як назва типу це очікування від dataclass чи TS-класу. `True` означало б
    коерцію в стилі Pydantic lax-режиму, а `TypeError` рантаймову валідацію; ні того, ні іншого TypedDict
    не робить. mypy на цьому рядку дав би помилку, але запуск від цього не залежить.

- id: t3
  type: code
  title: "Реєстр рендерерів і функція, що повертає функцію"
  prompt: |
    Рендерер це функція `ElementConfig -> str`, у стартері це alias `Renderer`. Напишіть дві функції.

    1. `with_label(render)` повертає **новий** рендерер: якщо в елемента є ключ `label`, результат
       це `<label for="<id>"><label></label>` і одразу за ним те, що повернув `render`; якщо ключа
       немає, результат `render` без змін.
    2. `render_all(elements, registry)` рендерить кожен елемент рендерером з `registry` за його `type`
       і повертає список рядків. Якщо рендерера для типу немає, замість винятку в список іде
       `<!-- no renderer: <type> -->`. `elements` може бути будь-яким iterable, зокрема генератором.

    ```python
    render_input = lambda el: f'<input name="{el["id"]}">'
    with_label(render_input)({"id": "email", "type": "input", "label": "E-mail"})
    # '<label for="email">E-mail</label><input name="email">'
    ```
  starter: |
    from collections.abc import Callable, Iterable, Mapping
    from typing import Literal, NotRequired, TypedDict

    type ElementType = Literal["input", "text", "select"]

    class ElementConfig(TypedDict):
        id: str
        type: ElementType
        label: NotRequired[str]

    type Renderer = Callable[[ElementConfig], str]

    def with_label(render: Renderer) -> Renderer:
        ...

    def render_all(elements: Iterable[ElementConfig], registry: Mapping[ElementType, Renderer]) -> list[str]:
        ...
  harness: |
    def render_input(el: ElementConfig) -> str:
        return f'<input name="{el["id"]}">'

    def render_text(el: ElementConfig) -> str:
        return f'<textarea name="{el["id"]}"></textarea>'

    registry: dict[ElementType, Renderer] = {"input": with_label(render_input), "text": render_text}
    elements: list[ElementConfig] = [
        {"id": "email", "type": "input", "label": "E-mail"},
        {"id": "phone", "type": "input"},
        {"id": "bio", "type": "text", "label": "About"},
        {"id": "country", "type": "select"},
    ]
    for html in render_all(elements, registry):
        print(html)
    print(render_all((), registry))
    print(render_all((el for el in elements if el["type"] == "text"), {"text": with_label(render_text)}))
    print(with_label(render_input) is render_input)
  expected: |
    <label for="email">E-mail</label><input name="email">
    <input name="phone">
    <textarea name="bio"></textarea>
    <!-- no renderer: select -->
    []
    ['<label for="bio">About</label><textarea name="bio"></textarea>']
    False
  hints:
    - "with_label визначає всередині себе нову функцію з тією самою сигнатурою, що й Renderer, і повертає її, не викликаючи. Вона бачить `render` через замикання."
    - "Усередині: `label = el.get(\"label\")`; якщо `label is None`, повернути `render(el)`, інакше префікс з `<label>`. У render_all: `renderer = registry.get(el[\"type\"])` і перевірка на None."
  solution: |
    from collections.abc import Callable, Iterable, Mapping
    from typing import Literal, NotRequired, TypedDict

    type ElementType = Literal["input", "text", "select"]

    class ElementConfig(TypedDict):
        id: str
        type: ElementType
        label: NotRequired[str]

    type Renderer = Callable[[ElementConfig], str]

    def with_label(render: Renderer) -> Renderer:
        def wrapped(el: ElementConfig) -> str:
            label = el.get("label")
            if label is None:
                return render(el)
            return f'<label for="{el["id"]}">{label}</label>' + render(el)
        return wrapped

    def render_all(elements: Iterable[ElementConfig], registry: Mapping[ElementType, Renderer]) -> list[str]:
        result: list[str] = []
        for el in elements:
            renderer = registry.get(el["type"])
            if renderer is None:
                result.append(f"<!-- no renderer: {el['type']} -->")
            else:
                result.append(renderer(el))
        return result
  requires: []
  runtime: browser

- id: t4
  type: code
  title: "Сирий JSON елемента в TypedDict з Literal"
  prompt: |
    Елемент форми приходить з `json.loads` як `dict[str, object]`. Напишіть `parse_element(raw)`, яка
    перевіряє його вручну й повертає `ElementConfig` (TypedDict зі стартера):

    - `id` має бути непорожнім рядком, інакше `ValueError("id: expected non-empty string")`;
    - `type` має бути одним з типів `ElementType`, інакше `ValueError(f"type: unknown element type {value!r}")`;
    - `label` необов'язковий; якщо ключ є, значення має бути рядком, інакше `ValueError("label: expected string")`;
    - інші ключі відкидаються; результат це новий dict лише з `id`, `type` і, якщо був, `label`.

    `ELEMENT_TYPES` зберіть з `ElementType` через `get_args`, не переписуючи значення вдруге.
    Для звуження `object` до `ElementType` напишіть предикат з `TypeGuard` (у 3.12 `TypeIs` ще немає
    в `typing`). Платформа не запускає mypy, перевіряється поведінка; локально рішення має проходити
    `.venv/bin/mypy --strict` без `cast`.

    ```python
    parse_element({"id": "bio", "type": "text", "label": "About", "max": 500})
    # {'id': 'bio', 'type': 'text', 'label': 'About'}
    ```
  starter: |
    from typing import Literal, NotRequired, TypedDict, TypeGuard, get_args

    type ElementType = Literal["input", "text", "select"]

    class ElementConfig(TypedDict):
        id: str
        type: ElementType
        label: NotRequired[str]

    ELEMENT_TYPES: tuple[str, ...] = ()  # зберіть з ElementType

    def is_element_type(value: object) -> TypeGuard[ElementType]:
        ...

    def parse_element(raw: dict[str, object]) -> ElementConfig:
        ...
  harness: |
    print(ELEMENT_TYPES)
    print(parse_element({"id": "email", "type": "input"}))
    print(parse_element({"id": "bio", "type": "text", "label": "About", "max": 500}))
    bad: list[dict[str, object]] = [
        {"id": "", "type": "input"},
        {"type": "input"},
        {"id": "x", "type": "checkbox"},
        {"id": "x", "type": ["input"]},
        {"id": "x", "type": "select", "label": 5},
    ]
    for raw in bad:
        try:
            parse_element(raw)
        except ValueError as e:
            print("ValueError:", e)
    print(type(parse_element({"id": "a", "type": "select", "label": ""})).__name__)
  expected: |
    ('input', 'text', 'select')
    {'id': 'email', 'type': 'input'}
    {'id': 'bio', 'type': 'text', 'label': 'About'}
    ValueError: id: expected non-empty string
    ValueError: id: expected non-empty string
    ValueError: type: unknown element type 'checkbox'
    ValueError: type: unknown element type ['input']
    ValueError: label: expected string
    dict
  hints:
    - "Значення alias, створеного через `type`, лежить в атрибуті `__value__`, і саме з нього `get_args` дістає літерали. Кожне поле перевіряйте через isinstance або предикат, а результат збирайте в новий словник."
    - "`ELEMENT_TYPES = get_args(ElementType.__value__)`; предикат `return value in ELEMENT_TYPES`; для id `if not isinstance(field_id, str) or not field_id: raise ...`."
    - "Збирайте результат як `result: ElementConfig = {\"id\": field_id, \"type\": kind}` і лише потім, якщо `\"label\" in raw` і значення рядок, `result[\"label\"] = label`."
  solution: |
    from typing import Literal, NotRequired, TypedDict, TypeGuard, get_args

    type ElementType = Literal["input", "text", "select"]

    class ElementConfig(TypedDict):
        id: str
        type: ElementType
        label: NotRequired[str]

    ELEMENT_TYPES: tuple[str, ...] = get_args(ElementType.__value__)

    def is_element_type(value: object) -> TypeGuard[ElementType]:
        return value in ELEMENT_TYPES

    def parse_element(raw: dict[str, object]) -> ElementConfig:
        field_id = raw.get("id")
        if not isinstance(field_id, str) or not field_id:
            raise ValueError("id: expected non-empty string")
        kind = raw.get("type")
        if not is_element_type(kind):
            raise ValueError(f"type: unknown element type {kind!r}")
        result: ElementConfig = {"id": field_id, "type": kind}
        if "label" in raw:
            label = raw["label"]
            if not isinstance(label, str):
                raise ValueError("label: expected string")
            result["label"] = label
        return result
  requires: []
  runtime: browser

- id: q4
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    from typing import cast

    raw: object = "42"
    n = cast(int, raw)
    print(n + 1)
    ```
  options:
    - "43"
    - "TypeError: can only concatenate str (not \"int\") to str"
    - "421"
    - "ValueError: invalid literal for int() with base 10: '42'"
  answer: 1
  explain: |
    `cast` у рантаймі повертає свій другий аргумент без змін, як `as` у TS: `n` лишається рядком
    `"42"`, а `"42" + 1` дає `TypeError`. `43` вийшло б з `int(raw)`, тобто з перетворення, якого `cast`
    не робить. `421` це JS-коерція `"42" + 1`, Python рядок з числом не складає. `ValueError` з'явився б
    лише тоді, якби `cast` намагався викликати `int(...)`, а він не викликає нічого.

- id: t5
