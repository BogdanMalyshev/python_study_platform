  prompt: |
    У репозиторії капстоуну створіть `src/formbuilder/config.py`: статичний опис сирого JSON-конфігу
    форми до валідації, тобто того, що повертає `json.loads`. Беріть не навчальну схему з уроку, а свій
    реальний контракт FormBuilder: ті типи елементів, ті необов'язкові ключі й ті `null`, які були у вашому
    фронтенді. Ім'я файлу остаточне: у m2-l09 ці TypedDict у тому самому `config.py` замінять Pydantic-моделі,
    тож тут важливо точно передати форму JSON. `Renderer`, `REGISTRY` і `missing_renderers` живуть тут
    тимчасово: у m2-l07 рендеринг переїде в пакет `src/formbuilder/renderers/` з Protocol замість `Callable`,
    і тоді їх із `config.py` приберіть.

    Платформа mypy не запускає: перевірка локальна, командою з `verify`.
  checklist:
    - "`ElementType` це `type`-alias на `Literal` з усіма типами елементів вашого FormBuilder, а рантаймовий кортеж типів отримується через `get_args(ElementType.__value__)`, без дублювання значень"
    - "`ElementConfig` і `FormConfig` це TypedDict: відсутні ключі через `NotRequired`, ключі зі значенням `null` через `| None`, рівно як у JSON-контракті; вкладені елементи через рядкову анотацію `list[\"ElementConfig\"]`"
    - "`Renderer = Callable[[ElementConfig, list[str]], str]` і `REGISTRY: dict[ElementType, Renderer]`; функція `missing_renderers() -> list[str]` повертає типи з `Literal`, для яких рендерера немає, і на вашому реєстрі повертає `[]`"
    - "Generic `Node[T]`, `to_tree`, `tree_map[T, U]` і `flatten[T]` у синтаксисі 3.12, без `TypeVar`"
    - "Параметри, які лише читаються, анотовані `Iterable` / `Sequence` / `Mapping`, результати конкретними типами"
    - "`mypy --strict` проходить без `Any`, `cast` і `type: ignore`"
  verify: "cd capstone && uv run mypy --strict src/formbuilder/config.py"
