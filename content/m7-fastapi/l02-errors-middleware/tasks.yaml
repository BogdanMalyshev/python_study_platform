- id: q1
  type: quiz
  question: |
    Обробник зареєстровано так:
    ```python
    from fastapi import FastAPI, HTTPException

    app = FastAPI()

    @app.exception_handler(HTTPException)
    async def http_error(request, exc):
        return JSONResponse({"error": {"code": f"http_{exc.status_code}", "message": exc.detail}},
                            status_code=exc.status_code)
    ```
    Що поверне `GET /no/such/route`, якщо такого маршруту немає?
  options:
    - "404 `{\"detail\": \"Not Found\"}`"
    - "404 `{\"error\": {\"code\": \"http_404\", \"message\": \"Not Found\"}}`"
    - "500, бо обробник не знайшов маршрут"
    - "404 з порожнім тілом"
  answer: 0
  explain: |
    Маршрутизатор кидає `starlette.exceptions.HTTPException`, а обробник зареєстровано на
    `fastapi.HTTPException`, його підклас. Пошук іде за MRO класу винятку: у MRO Starlette-івського
    класу FastAPI-шного немає, тому спрацьовує вбудований обробник зі стандартним `{"detail": ...}`.
    Варіант з `http_404` був би правильним, якби обробник стояв на `starlette.exceptions.HTTPException`:
    тоді він ловить і ваші `raise HTTPException`, і 404/405 маршрутизатора. 500 тут немає звідки взятись:
    відсутній маршрут це звичайний 404, а не збій.

- id: t1
  type: code
  title: "Шлях поля з loc"
  prompt: |
    Напишіть `loc_to_path(loc)`, яка перетворює `loc` з помилки FastAPI на плоский шлях для фронтенду.

    - Перший елемент `loc` зрізається, якщо це джерело: `"body"`, `"query"`, `"path"`, `"header"`, `"cookie"`.
    - Решта елементів, рядки й числа, з'єднується через крапку.
    - Якщо після зрізу нічого не лишилось (помилка на рівні всієї моделі), повертається порожній рядок.

    ```python
    loc_to_path(("body", "elements", 0, "maxLength"))   # 'elements.0.maxLength'
    loc_to_path(("query", "pageSize"))                  # 'pageSize'
    loc_to_path(("body",))                              # ''
    ```
  starter: |
    SOURCES = {"body", "query", "path", "header", "cookie"}


    def loc_to_path(loc: tuple[str | int, ...]) -> str:
        ...
  harness: |
    print(repr(loc_to_path(("body", "elements", 0, "maxLength"))))
    print(repr(loc_to_path(("query", "pageSize"))))
    print(repr(loc_to_path(("path", "form_id"))))
    print(repr(loc_to_path(("body",))))
    print(repr(loc_to_path(("body", "elements", 1, "children", 0, "id"))))
    print(repr(loc_to_path(("title",))))
    print(repr(loc_to_path(())))
  expected: |
    'elements.0.maxLength'
    'pageSize'
    'form_id'
    ''
    'elements.1.children.0.id'
    'title'
    ''
  hints:
    - "Перевірте, чи перший елемент є в множині джерел, і якщо так, візьміть зріз без нього. Порожній кортеж не має першого елемента."
    - "`parts = loc[1:] if loc and loc[0] in SOURCES else loc`, далі `\".\".join(str(p) for p in parts)`: числа треба привести до рядка, `join` сам цього не робить."
  solution: |
    SOURCES = {"body", "query", "path", "header", "cookie"}


    def loc_to_path(loc: tuple[str | int, ...]) -> str:
        parts = loc[1:] if loc and loc[0] in SOURCES else loc
        return ".".join(str(p) for p in parts)
  requires: []
  runtime: browser

- id: t2
  type: code
  title: "Помилки Pydantic у формат фронтенду"
  prompt: |
    Напишіть `to_error_body(errors)`, яка перетворює список помилок з `RequestValidationError.errors()`
    на тіло відповіді капстоуну:

    ```python
    {"error": {"code": "validation_error",
               "message": "<кількість> invalid field(s)",
               "fields": [{"path": ..., "code": ..., "message": ...}, ...]}}
    ```

    - `path` це `loc` без першого елемента-джерела, з'єднаний крапками (як у t1).
    - `code` це `type` помилки.
    - `message` це `msg`, крім помилок з `type == "value_error"`: для них беріть текст самого винятку
      з `ctx["error"]`, без префікса `Value error, `, який Pydantic додає в `msg`.
    - Результат має серіалізуватися через `json.dumps`: жодних об'єктів винятків усередині.

    Харнес будує справжні помилки Pydantic з camelCase-аліасами і додає на початок `loc` джерело `"body"`,
    як це робить FastAPI.
  starter: |
    SOURCES = {"body", "query", "path", "header", "cookie"}


    def to_error_body(errors: list[dict]) -> dict:
        ...
  harness: |
    import json
    from pydantic import BaseModel, ConfigDict, Field, ValidationError, model_validator
    from pydantic.alias_generators import to_camel


    class Element(BaseModel):
        model_config = ConfigDict(alias_generator=to_camel, validate_by_name=True)
        id: str
        max_length: int | None = Field(default=None, ge=1)


    class FormIn(BaseModel):
        model_config = ConfigDict(alias_generator=to_camel, validate_by_name=True)
        title: str = Field(min_length=1)
        min_answers: int = 0
        max_answers: int = 10
        elements: list[Element] = []

        @model_validator(mode="after")
        def check_range(self):
            if self.min_answers > self.max_answers:
                raise ValueError("minAnswers must be <= maxAnswers")
            return self


    def fastapi_errors(data: dict) -> list[dict]:
        try:
            FormIn.model_validate(data)
        except ValidationError as e:
            return [{**err, "loc": ("body", *err["loc"])} for err in e.errors()]
        return []


    body = to_error_body(fastapi_errors({"title": "", "elements": [{"id": "e1", "maxLength": 0}, {}]}))
    print(json.dumps(body, indent=2))
    body = to_error_body(fastapi_errors({"title": "Poll", "minAnswers": 5, "maxAnswers": 1}))
    print(json.dumps(body))
    print(json.dumps(to_error_body([{"type": "int_parsing", "loc": ("query", "pageSize"), "msg": "Input should be a valid integer", "input": "x"}])))
  expected: |
    {
      "error": {
        "code": "validation_error",
        "message": "3 invalid field(s)",
        "fields": [
          {
            "path": "title",
            "code": "string_too_short",
            "message": "String should have at least 1 character"
          },
          {
            "path": "elements.0.maxLength",
            "code": "greater_than_equal",
            "message": "Input should be greater than or equal to 1"
          },
          {
            "path": "elements.1.id",
            "code": "missing",
            "message": "Field required"
          }
        ]
      }
    }
    {"error": {"code": "validation_error", "message": "1 invalid field(s)", "fields": [{"path": "", "code": "value_error", "message": "minAnswers must be <= maxAnswers"}]}}
    {"error": {"code": "validation_error", "message": "1 invalid field(s)", "fields": [{"path": "pageSize", "code": "int_parsing", "message": "Input should be a valid integer"}]}}
  hints:
    - "Розбийте на дві частини: шлях з `loc` (як у t1) і текст повідомлення. Для `value_error` у `err[\"ctx\"][\"error\"]` лежить об'єкт `ValueError`, а не рядок."
    - "Текст винятку це `str(err[\"ctx\"][\"error\"])`. `fields` збирайте списком словників, `message` верхнього рівня через f-рядок з `len(fields)`."
    - |
      Майже рішення:
      ```python
      message = str(err["ctx"]["error"]) if err["type"] == "value_error" else err["msg"]
      fields.append({"path": path, "code": err["type"], "message": message})
      ```
  solution: |
    SOURCES = {"body", "query", "path", "header", "cookie"}


    def to_error_body(errors: list[dict]) -> dict:
        fields = []
        for err in errors:
            loc = err["loc"]
            parts = loc[1:] if loc and loc[0] in SOURCES else loc
            if err["type"] == "value_error":
                message = str(err["ctx"]["error"])
            else:
                message = err["msg"]
            fields.append({"path": ".".join(str(p) for p in parts), "code": err["type"], "message": message})
        return {
            "error": {
                "code": "validation_error",
                "message": f"{len(fields)} invalid field(s)",
                "fields": fields,
            }
        }
  requires: [pydantic]
  runtime: browser

- id: t3
  type: code
  title: "Пошук обробника за MRO"
  prompt: |
    Відтворіть, як Starlette вибирає exception handler. Напишіть `error_response(exc)`, яка повертає
    пару `(status, body)` за таблицею `HANDLERS`.

    - Обробник шукається за `type(exc).__mro__`: перший клас з MRO, який є в `HANDLERS`, перемагає.
      Порядок ключів у словнику значення не має.
