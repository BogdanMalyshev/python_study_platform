    HANDLERS: dict[type[Exception], tuple[int, str]] = {
        ConfigError: (422, "invalid_config"),
        JobNotFound: (404, "job_not_found"),
        UnknownElementType: (422, "unknown_element_type"),
    }


    def error_response(exc: Exception) -> tuple[int, dict]:
        ...
  harness: |
    class DuplicateElementId(ConfigError): ...

    print(error_response(UnknownElementType("unknown type 'slider'")))
    print(error_response(DuplicateElementId("duplicate id 'email'")))
    print(error_response(ConfigError("title is empty")))
    print(error_response(JobNotFound("job 'j-9' not found")))
    print(error_response(KeyError("j-9")))
    print(error_response(RuntimeError("password=hunter2 rejected by db")))
  expected: |
    (422, {'error': {'code': 'unknown_element_type', 'message': "unknown type 'slider'"}})
    (422, {'error': {'code': 'invalid_config', 'message': "duplicate id 'email'"}})
    (422, {'error': {'code': 'invalid_config', 'message': 'title is empty'}})
    (404, {'error': {'code': 'job_not_found', 'message': "job 'j-9' not found"}})
    (500, {'error': {'code': 'internal_error', 'message': 'Internal server error'}})
