- id: t4
  type: code
  title: "Стек middleware як цибуля"
  prompt: |
    Напишіть `build_stack(endpoint, middlewares)`, яка збирає застосунок так, як це робить Starlette.

    - `endpoint` це `async def endpoint(request) -> dict`.
    - Кожен middleware це `async def mw(request, call_next) -> dict`, де `call_next(request)` викликає
      наступний шар.
    - `middlewares` перелічені в порядку реєстрації (`add_middleware`). Останній зареєстрований має бути
      зовнішнім: він першим бачить запит і останнім відповідь.
    - Повертається `async`-функція `app(request)`. Без middleware `app` поводиться як `endpoint`.

    Харнес записує порядок проходу в `log` і додає ім'я кожного middleware в `headers` відповіді на виході.
  starter: |
    from collections.abc import Awaitable, Callable

    Endpoint = Callable[[dict], Awaitable[dict]]
    Middleware = Callable[[dict, Endpoint], Awaitable[dict]]


    def build_stack(endpoint: Endpoint, middlewares: list[Middleware]) -> Endpoint:
        ...
  harness: |
    import asyncio

    log = []


    def tag(name):
        async def mw(request, call_next):
            log.append(f"{name}>")
            response = await call_next(request)
            log.append(f"<{name}")
            return {**response, "headers": [*response["headers"], name]}
        return mw


    async def deny_all(request, call_next):
        log.append("deny")
        return {"status": 401, "headers": []}


    async def endpoint(request):
        log.append("endpoint")
        return {"status": 200, "headers": []}


    async def main():
        app = build_stack(endpoint, [tag("cors"), tag("request_id"), tag("timing")])
        print(await app({"path": "/health"}))
        print(" ".join(log))
        log.clear()
        print(await build_stack(endpoint, [])({"path": "/"}))
        print(" ".join(log))
        log.clear()
        print(await build_stack(endpoint, [deny_all, tag("request_id")])({"path": "/"}))
        print(" ".join(log))


    asyncio.run(main())
  expected: |
    {'status': 200, 'headers': ['cors', 'request_id', 'timing']}
    timing> request_id> cors> endpoint <cors <request_id <timing
    {'status': 200, 'headers': []}
    endpoint
    {'status': 401, 'headers': ['request_id']}
    request_id> deny <request_id
  hints:
    - "Почніть з `app = endpoint` і загортайте його по черзі кожним middleware зі списку: перший зареєстрований загортається першим і тому опиняється найглибше."
    - "Обгортка в циклі через `lambda request: mw(request, app)` зловить пізнє зв'язування з m1-l06: lambda читає `app` в момент виклику, коли це вже вона сама, і стек падає з `RecursionError`. Фіксуйте значення через фабрику-функцію або `functools.partial`."
    - |
      Майже рішення:
      ```python
      def wrap(mw, inner):
          async def app(request):
              return await mw(request, inner)
          return app
      ```
  solution: |
    from collections.abc import Awaitable, Callable

    Endpoint = Callable[[dict], Awaitable[dict]]
    Middleware = Callable[[dict, Endpoint], Awaitable[dict]]


    def build_stack(endpoint: Endpoint, middlewares: list[Middleware]) -> Endpoint:
        def wrap(mw: Middleware, inner: Endpoint) -> Endpoint:
            async def app(request: dict) -> dict:
                return await mw(request, inner)
            return app

        app = endpoint
        for mw in middlewares:
            app = wrap(mw, app)
        return app
  requires: []
  runtime: browser

- id: q2
  type: quiz
  question: |
    ```python
    app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True)
    ```
    Що отримає браузер на сторінці `https://evil.example`, який робить `fetch(url, {credentials: "include"})`
    до цього API?
  options:
    - "`Access-Control-Allow-Origin: *`, і браузер відхилить відповідь, бо `*` несумісна з credentials"
    - "`Access-Control-Allow-Origin: https://evil.example` і `Access-Control-Allow-Credentials: true`, тобто відповідь з cookies користувача доступна скрипту"
    - "Starlette кине помилку конфігурації при створенні middleware"
    - "400 `Disallowed CORS origin`"
  answer: 1
  explain: |
    Starlette для `"*"` разом з `allow_credentials=True` віддзеркалює конкретний `Origin` запиту і ставить
    `allow-credentials: true`, тож для браузера все легально, і будь-який сайт читає відповіді з cookies
    користувача. Перший варіант це поведінка пакета `cors` в Express з `origin: "*"`: там конфіг просто не
    працює, і звідси хибне відчуття, що комбінація безпечна. Помилки конфігурації Starlette не кидає.
    `Disallowed CORS origin` буває лише на preflight з origin-ом, якого немає в явному списку.

- id: q3
  type: quiz
  question: |
    Застосунок створено з `FastAPI(debug=True)`, зареєстровано `@app.exception_handler(Exception)`, який
    логує виняток і повертає JSON `{"error": {"code": "internal_error"}}` зі статусом 500. Обробник маршруту
    падає з `KeyError`. Що отримає клієнт?
  options:
    - "500 з JSON від вашого обробника"
    - "500 з JSON від вашого обробника і полем з traceback"
    - "500 з traceback текстом; ваш обробник не викликається"
    - "422, бо `KeyError` вважається помилкою вводу"
  answer: 2
  explain: |
    `ServerErrorMiddleware` у режимі `debug` віддає `debug_response` з traceback і не викликає зареєстрований
    обробник `Exception` взагалі: у лозі не з'явиться і ваш запис. FastAPI не домішує traceback у ваш JSON,
    тому другий варіант неможливий. `KeyError` не має жодного стосунку до 422: 422 буває лише від
    `RequestValidationError` або від вашого обробника. Звідси правило: `debug` з налаштувань, у prod `False`.

- id: q4
  type: quiz
  question: |
    ```python
    app = FastAPI()
    app.add_middleware(CORSMiddleware, allow_origins=["http://localhost:5173"])

    @app.middleware("http")
    async def request_id(request, call_next):
        response = await call_next(request)
        response.headers["X-Request-ID"] = "req-1"
        return response

    @app.exception_handler(Exception)
    async def unhandled(request, exc):
        return JSONResponse({"error": {"code": "internal_error"}}, status_code=500)

    @app.get("/boom")
    def boom():
        raise RuntimeError("db is down")
    ```
    Які з заголовків `X-Request-ID` і `Access-Control-Allow-Origin` будуть у відповіді 500 на
    `GET /boom` з `Origin: http://localhost:5173`?
  options:
    - "Обидва"
    - "Лише `Access-Control-Allow-Origin`"
    - "Лише `X-Request-ID`"
    - "Жодного"
  answer: 3
  explain: |
    Обробник `Exception` викликається в `ServerErrorMiddleware`, найзовнішньому шарі, над усіма вашими
    middleware. `RuntimeError` пролітає крізь CORS і `request_id` нагору, а 500 збирається вже над ними, тож
    жоден не додає заголовків. Відповідь 404 чи 422 отримала б обидва, бо їх збирає `ExceptionMiddleware`
    усередині стеку. Виправлення: ловити `Exception` у middleware з request id і додавати `CORSMiddleware`
    останнім, щоб він був зовнішнім.

- id: p1
  type: project
  title: "Єдиний формат помилок, request id, CORS і статика в капстоуні"
  prompt: |
    У пакеті `src/formbuilder/api/` з m7-l01 зведіть усі помилки API до одного формату і додайте
    інфраструктурні middleware. Код уроку в розділі "Для капстоуну" це орієнтир, а не готовий файл.

    1. `formbuilder/jobs.py`: `class JobNotFound(LookupError)` з атрибутом `job_id` і повідомленням
       `job '<id>' not found`. `GET /jobs/{job_id}` для невідомого id кидає `JobNotFound`,
       а не `HTTPException`.
    2. `formbuilder/api/errors.py`: Pydantic-моделі `FieldError`, `ErrorBody`, `ErrorResponse` для формату
       `{"error": {"code", "message", "fields"}}`; функції `loc_to_path` і `to_field_errors` з завдань t1, t2;
       обробники для `RequestValidationError` (`validation_error`, 422), `ConfigError` (`invalid_config`, 422,
       `fields` з `exc.__cause__`, якщо це `ValidationError`), `JobNotFound` (`job_not_found`, 404) і
       `starlette.exceptions.HTTPException` (`http_<status>`, заголовки винятку зберігаються);
       `install_error_handlers(app)`.
    3. `formbuilder/api/middleware.py`: middleware `request_context`, який бере `X-Request-ID` із запиту
       або генерує `uuid4().hex`, кладе його в `request.state` і в `ContextVar` (або `bind_contextvars`
       structlog, якщо логування з m5-l09 вже на ньому), ловить `Exception` навколо `call_next`, логує
       через `logging.getLogger("formbuilder.api").exception(...)` і повертає 500 `internal_error` без
       тексту винятку, пише рядок логу з методом, шляхом, статусом і тривалістю, ставить `X-Request-ID`
       у відповідь. `install_middleware(app, cors_origins)` додає його, а `CORSMiddleware` останнім
       з `expose_headers=["X-Request-ID"]`. Origin-и з налаштувань, за замовчуванням `http://localhost:5173`.
