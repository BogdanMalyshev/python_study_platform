  hints:
    - "Перебір `HANDLERS` з `isinstance` залежить від порядку ключів: `ConfigError` стоїть першим і перехопить `UnknownElementType`. Ітеруйте не словник, а MRO класу винятку."
    - "`for cls in type(exc).__mro__: if cls in HANDLERS: ...`; після циклу без знахідки повертайте 500. `KeyError` це `LookupError`, але не `JobNotFound`, тому він у таблиці не знаходиться."
  solution: |
    class ConfigError(Exception): ...
    class UnknownElementType(ConfigError): ...
    class JobNotFound(LookupError): ...


    HANDLERS: dict[type[Exception], tuple[int, str]] = {
        ConfigError: (422, "invalid_config"),
        JobNotFound: (404, "job_not_found"),
        UnknownElementType: (422, "unknown_element_type"),
    }


    def error_response(exc: Exception) -> tuple[int, dict]:
        for cls in type(exc).__mro__:
            if cls in HANDLERS:
                status, code = HANDLERS[cls]
                return status, {"error": {"code": code, "message": str(exc)}}
        return 500, {"error": {"code": "internal_error", "message": "Internal server error"}}
