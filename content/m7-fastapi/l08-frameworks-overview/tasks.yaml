- id: q1
  type: quiz
  question: |
    Що надрукує цей код?
    ```python
    from fastapi import FastAPI
    from starlette.applications import Starlette

    print(FastAPI.__mro__[1].__name__, issubclass(FastAPI, Starlette))
    ```
  options:
    - "Starlette True"
    - "object False"
    - "Flask False"
    - "ASGIApp True"
  answer: 0
  explain: |
    FastAPI це підклас `Starlette`: ASGI-ядро з роутингом, middleware, WebSocket, `TestClient` і `lifespan`
    дає Starlette, а FastAPI додає зверху Pydantic-валідацію параметрів, `Depends` і генерацію OpenAPI.
    `object False` це інтуїція "FastAPI написаний з нуля", як Fastify. `Flask` спокусливий через схожі
    декоратори `@app.get`, але Flask це WSGI-фреймворк, і FastAPI з ним не пов'язаний. `ASGIApp` у Starlette
    лише псевдонім типу для анотацій, а не базовий клас.

- id: q2
  type: quiz
  question: |
    `hello_flask.py` містить звичайний Flask-застосунок `app = Flask(__name__)` з маршрутом `/health`.
    Його запускають так, без жодного адаптера:
    ```bash
    uvicorn hello_flask:app --port 18004
    curl http://127.0.0.1:18004/health
    ```
    Що станеться?
  options:
    - "uvicorn відмовиться стартувати: він перевіряє, що застосунок це ASGI"
    - "Сервер стартує, але кожен запит дає 500, а в лозі `TypeError: Flask.__call__() missing 1 required positional argument: 'start_response'`"
    - "Усе працює: uvicorn сам розпізнає WSGI-застосунок і загорне його"
    - "Усе працює, але обробники виконуються послідовно, без async"
  answer: 1
  explain: |
    Контракт між сервером і застосунком це лише сигнатура виклику. uvicorn не валідує застосунок на старті:
    він бачить, що `Flask.__call__` не корутина, і вирішує, що це старий варіант ASGI з одним аргументом
    `scope`. На першому запиті він викликає `app(scope)`, а Flask чекає `(environ, start_response)`, тому
    `TypeError` і 500 на кожен запит. Варіанти "відмовиться стартувати" і "сам загорне" це інтуїція з Node,
    де сервер і фреймворк одне ціле: режим `auto` в uvicorn WSGI не розпізнає. Щоб це запрацювало, потрібен
    явний адаптер `asgiref.wsgi.WsgiToAsgi`, явний прапорець `uvicorn --interface wsgi` або WSGI-сервер
    на кшталт gunicorn. Варіант "послідовно, без async" описує те, що було б з правильним адаптером, а не тут.

- id: q3
  type: quiz
  question: |
    Фронтенд FormBuilder показує помилки форми, коли `res.status === 422`. Бекенд переписали на Litestar:
    ```python
    class FormStruct(msgspec.Struct):
        name: str
        fields: list[str] = []

    @post("/forms")
    async def create_form(data: FormStruct) -> FormStruct:
        return data
    ```
    Фронт надсилає `{"fields": "email"}`. Що він отримає?
  options:
    - "422 з двома помилками: про `name` і про `fields`"
    - "400 з однією помилкою, про `fields`"
    - "400 з двома помилками: про `name` і про `fields`"
    - "201, бо `msgspec.Struct` не валідує вхідні дані"
  answer: 1
  explain: |
    Litestar на помилку валідації повертає 400, а msgspec зупиняється на першій знайденій помилці, тут це
    рядок замість масиву в `fields`. 422 зі списком усіх помилок це поведінка FastAPI з Pydantic, і саме
    її хардкодить фронт. Два повідомлення при 400 Litestar дасть, якщо модель буде Pydantic `BaseModel`:
    тоді валідує Pydantic і збирає всі помилки. 201 Litestar справді ставить за замовчуванням, але лише на
    успішний POST.

- id: q4
  type: quiz
  question: |
    Внутрішній сервіс компанії: близько 30 таблиць довідників, які менеджери редагують через веб-інтерфейс,
    ролі й права доступу, журнал змін. Async-навантаження немає. Команда це три Python-розробники, які
    кілька років працювали з Django. Що найраціональніше обрати?
  options:
    - "Django з вбудованою адмінкою, DRF додати, якщо знадобиться JSON API"
    - "FastAPI, бо він сучасніший, швидший і типізований"
    - "Litestar, бо вбудовані DTO зручні для 30 моделей"
    - "Flask, бо мікрофреймворк простіший для невеликого сервісу"
  answer: 0
  explain: |
    Усі п'ять критеріїв указують в один бік: адмінка для не-розробників, користувачі, права й журнал змін
    у Django вже написані, async не потрібен, а команда знає саме його. FastAPI і Litestar змусили б
    самостійно обирати ORM, міграції, auth і адмінку, тобто писати те, що Django дає готовим; "сучасніший
    і швидший" тут не критерій, бо вузьке місце не в продуктивності фреймворку. Flask "простіший" лише на
    старті: адмінку, auth і міграції довелося б збирати з розширень.

- id: p1
  type: project
  title: "docs/why-fastapi.md: чому FormBuilder на FastAPI"
  prompt: |
    Напишіть у репозиторії капстоуну `docs/why-fastapi.md`: коротке архітектурне рішення (ADR) про вибір
    фреймворку для бекенду FormBuilder. Це текст для співбесіди й для майбутнього себе, тож пишіть так,
    щоб його можна було переказати за дві хвилини. Обсяг орієнтовно одна-дві сторінки.

    Структура:

    1. **Контекст.** Що робить бекенд FormBuilder: типізований JSON-конфіг, версії в SQLite, черга генерації,
       рендер, WebSocket-статус. Які з цього випливають вимоги до фреймворку.
    2. **Варіанти.** Django (+ DRF), Flask, FastAPI, Litestar. Для кожного два-три речення про те, як на ньому
       виглядав би саме цей проєкт, з посиланням на конкретні частини вашого коду.
    3. **Порівняння.** Таблиця з п'ятьма критеріями з уроку (команда, адмінка, async, типи, екосистема)
       і чотирма стовпцями-фреймворками.
    4. **Рішення і причини.** Чому FastAPI, сформульовано через ваші вимоги, а не через популярність.
    5. **Наслідки.** Чого FastAPI не дав і як ви це закрили (сховище, фоновий воркер, налаштування), і що
       свідомо відкладено: ORM, міграції, auth, які прийдуть з курсом про бази даних.
    6. **Що переноситься.** Які модулі пакета `formbuilder` не імпортують FastAPI і пережили б зміну фреймворку.
  checklist:
    - "Файл `capstone/docs/why-fastapi.md` існує й не порожній"
    - "Є розділи: контекст, варіанти, порівняння, рішення, наслідки, що переноситься"
    - "Таблиця порівняння має п'ять рядків-критеріїв і стовпці Django, Flask, FastAPI, Litestar"
    - "Для кожного з чотирьох фреймворків названо хоча б одну конкретну частину капстоуну, яка на ньому виглядала б інакше"
    - "Згадано WSGI і ASGI і пояснено, чому для WebSocket-статусу потрібен ASGI"
    - "Чесно названо, чого FastAPI не дає з коробки (ORM, міграції, auth, адмінка) і що з цього відкладено до курсу про бази даних"
    - "Перелічено модулі `formbuilder`, які не імпортують `fastapi`, тобто доменний код, що переживе зміну фреймворку"
    - "Аргумент 'бо популярний' не використано як причину"
  verify: "cd capstone && uv run python -c \"from pathlib import Path; assert Path('docs/why-fastapi.md').read_text(encoding='utf-8').strip(), 'docs/why-fastapi.md is missing or empty'\""
