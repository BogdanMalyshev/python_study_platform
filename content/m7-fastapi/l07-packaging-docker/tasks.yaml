    Покладіть у корінь `capstone/` три файли з уроку: multi-stage `Dockerfile` (розділ "Multi-stage, non-root і що потрапляє в образ"), `.dockerignore` і `compose.yaml` з томом `/data` і `stop_grace_period`. FastAPI і uvicorn в основних залежностях капстоуну (m3-l02), тож `uv sync` без `--extra`. Версію uv в `COPY --from=ghcr.io/astral-sh/uv:<версія>` візьміть з `uv --version`.

    Статичні перевірки, які працюють без Docker, додайте як `tests/test_container_files.py`:

    ```python
    """Static checks of the container files: run without Docker."""

    import json
    from pathlib import Path

    ROOT = Path(__file__).resolve().parents[1]


    def steps(text: str) -> list[tuple[str, str]]:
        result = []
        for raw in text.replace("\\\n", " ").splitlines():
            line = raw.strip()
            if line and not line.startswith("#"):
                keyword, _, rest = line.partition(" ")
                result.append((keyword.upper(), rest.strip()))
        return result


    DOCKERFILE = steps((ROOT / "Dockerfile").read_text(encoding="utf-8"))
    LAST_FROM = max(i for i, (kw, _) in enumerate(DOCKERFILE) if kw == "FROM")
    FINAL = DOCKERFILE[LAST_FROM:]


    def index_of(keyword: str, needle: str) -> int:
        for i, (kw, rest) in enumerate(DOCKERFILE):
            if kw == keyword and needle in rest:
                return i
        raise AssertionError(f"no {keyword} with {needle!r} in Dockerfile")


    def test_dependencies_layer_comes_before_sources() -> None:
        deps = index_of("RUN", "--no-install-project")
        sources = index_of("COPY", "src")
        assert "--locked" in DOCKERFILE[deps][1], "use uv sync --locked"
        assert deps < sources, "install dependencies before copying src/"


    def test_final_stage_is_slim_non_root_and_without_uv() -> None:
        assert "python:3.12-slim" in DOCKERFILE[LAST_FROM][1]
        assert any(kw == "USER" for kw, _ in FINAL), "final stage runs as root"
        assert not any("astral-sh/uv" in rest for _, rest in FINAL), "uv in final stage"


    def test_cmd_is_exec_form_without_uv_run() -> None:
        raw = [rest for kw, rest in FINAL if kw == "CMD"][-1]
        assert raw.startswith("["), f"CMD must be exec form (JSON array), got: {raw}"
        cmd = json.loads(raw)
        assert cmd[:2] != ["uv", "run"], "call the venv script directly"


    def test_healthcheck_hits_health_endpoint() -> None:
        checks = [rest for kw, rest in FINAL if kw == "HEALTHCHECK"]
        assert checks and "/health" in checks[0], "HEALTHCHECK on /health is missing"


    def test_dockerignore_and_compose() -> None:
        ignored = (ROOT / ".dockerignore").read_text(encoding="utf-8").split()
        for entry in (".venv", ".env", "tests", "dist"):
            assert entry in ignored, f"{entry} must be in .dockerignore"
        compose = (ROOT / "compose.yaml").read_text(encoding="utf-8")
        assert "stop_grace_period" in compose, "set stop_grace_period in compose.yaml"
    ```

