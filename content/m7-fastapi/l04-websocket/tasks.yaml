                raise RuntimeError("send after close")
            self.sent.append(json.loads(text)["type"])

        async def close(self) -> None:
            self.closed = True


    TERMINAL = {"done", "failed"}


    async def session(ws: FakeSocket, events: AsyncIterator[dict]) -> str:
        ...
  harness: |
    async def job_events(statuses: list[str]):
        try:
            for status in statuses:
                await asyncio.sleep(0.03)
                yield {"type": status}
        finally:
            print("  events closed")


    async def run(title: str, script: list, statuses: list[str]) -> None:
        print(title)
        ws = FakeSocket(script)
        result = await session(ws, job_events(statuses))
        print(" ", result, ws.sent, "closed" if ws.closed else "open")


    async def main() -> None:
        await run("ping in the middle:", [(0.045, '{"type": "ping"}')],
                  ["queued", "running", "running", "done"])
        await run("tab closed:", [(0.075, None)],
                  ["queued", "running", "running", "done"])
        await run("failed, extra events ignored:", [],
                  ["queued", "failed", "running"])

    asyncio.run(main())
  expected: |
    ping in the middle:
      events closed
      finished ['queued', 'pong', 'running', 'running', 'done'] closed
    tab closed:
      events closed
      client left ['queued', 'running'] open
    failed, extra events ignored:
      events closed
      finished ['queued', 'failed'] closed
  hints:
    - "Читач це окрема корутина з `while True` навколо `receive_text()`, запущена як задача в `TaskGroup`; письменник працює прямо в тілі `async with`. Після термінальної події читача треба скасувати, інакше група чекатиме його вічно."
    - "Відключення приходить з групи як `ExceptionGroup`, тож потрібен `except* Disconnect:`. `return` у `except*` заборонений синтаксисом: поставте прапорець `left = True` і поверніть результат після `try`."
    - "`async with aclosing(events) as stream: async for event in stream: await ws.send_text(json.dumps(event)); if event['type'] in TERMINAL: break`, потім `reader.cancel()`. `aclosing` закриває генератор одразу після `break` або скасування, тому `events closed` друкується вчасно."
  solution: |
    import asyncio
    import json
    from collections.abc import AsyncIterator
    from contextlib import aclosing


    class Disconnect(Exception):
        pass


    class FakeSocket:
        def __init__(self, script: list[tuple[float, str | None]]) -> None:
            self.script = script          # (pause, text); text None means "client closed the tab"
            self.sent: list[str] = []
            self.closed = False

        async def receive_text(self) -> str:
            if not self.script:
                await asyncio.sleep(3600)  # the client stays silent
            pause, text = self.script.pop(0)
            await asyncio.sleep(pause)
            if text is None:
                raise Disconnect()
            return text

        async def send_text(self, text: str) -> None:
            if self.closed:
                raise RuntimeError("send after close")
            self.sent.append(json.loads(text)["type"])

        async def close(self) -> None:
            self.closed = True


    TERMINAL = {"done", "failed"}


    async def read_client(ws: FakeSocket) -> None:
        while True:
            message = json.loads(await ws.receive_text())
            if message.get("type") == "ping":
                await ws.send_text(json.dumps({"type": "pong"}))


    async def session(ws: FakeSocket, events: AsyncIterator[dict]) -> str:
        left = False
        try:
            async with asyncio.TaskGroup() as tg:
                reader = tg.create_task(read_client(ws))
                async with aclosing(events) as stream:
                    async for event in stream:
                        await ws.send_text(json.dumps(event))
                        if event["type"] in TERMINAL:
                            break
                reader.cancel()
        except* Disconnect:
            left = True
        if left:
            return "client left"
        await ws.close()
        return "finished"
  requires: []
  runtime: browser

- id: q3
  type: quiz
  question: |
    Капстоун запустили як `uvicorn formbuilder.api.app:app --workers 2`. Вкладка A потрапила в процес 1,
    вкладка B у процес 2; обидві дивляться задачу `landing`, яку рендерить воркер у процесі 1 і
    публікує події через `hub.publish(...)`. Що побачать вкладки?
  options:
    - "Обидві отримають усі події: `hub` це модульна змінна, а модуль імпортується один раз"
    - "A отримає всі події, B не отримає жодної і не побачить жодної помилки"
    - "B отримає `WebSocketDisconnect`, бо її кімнати немає в процесі 1"
    - "uvicorn сам синхронізує пам'ять воркерів через спільний event loop"
  answer: 1
  explain: |
    `--workers 2` запускає два окремі процеси Python. Модуль імпортується один раз у кожному
    процесі, тож `hub` і словник підписок існують у двох незалежних копіях, а спільного event loop між
    процесами немає. Публікація в процесі 1 доходить лише до черг процесу 1; у процесі 2 підписка B
    існує і чекає, нічого не ламається, тому й помилки немає, лише тиша. Розв'язок для кількох
    процесів це зовнішня шина pub/sub (Redis), як `@socket.io/redis-adapter` у світі Node.

- id: p1
  type: project
  title: "Протокол подій і WebSocket-ендпоінт статусу"
  prompt: |
    У капстоуні додайте статус генерації через WebSocket. FastAPI уже в основних залежностях (m3-l02),
    `httpx2` у dev-залежностях з m7-l01.

    - `src/formbuilder/hub.py`: `EventBase(v: Literal[1] = 1, job_id)`, моделі `Queued`,
      `Running(page, total)`, `Done(url, finished_at: datetime)`, `Failed(error)`, union `ServerEvent`
      з дискримінатором `type`, `TERMINAL = {"done", "failed"}`; клас `JobEvents` з розділу "Для капстоуну"
      (`publish`, `watch`, `watchers`), модульний екземпляр `hub` і залежність `get_hub()`. `watch` це
      звичайний метод, який реєструє чергу в момент виклику й повертає асинхронний генератор; модуль
      не імпортує FastAPI. `JobEvents` з `worker.py` (m7-l03) переїжджає сюди, воркер імпортує його звідси.
    - `src/formbuilder/api/ws.py`: вхідне повідомлення клієнта `Ping` і відповіді `Pong`,
      `ProtocolError(detail)`, `client_messages = TypeAdapter(...)`; `router` з
      `@router.websocket("/ws/jobs/{job_id}")`: `accept`,
      читач у `TaskGroup` (ping → pong, невалідне повідомлення → `ProtocolError`, з'єднання при цьому
      живе), стрім `hub.watch(job_id)` під `aclosing`, `close()` з 1000 після термінальної події,
      `except* WebSocketDisconnect` при розриві. Підключіть роутер у `create_app` з m7-l01.
    - `tests/test_ws.py`: тести ендпоінта через `TestClient.websocket_connect` з
      `app.dependency_overrides[get_hub]` на fake-хаб зі сценарієм подій.
  checklist:
    - "Тест: для сценарію `queued → running 1/2 → running 2/2 → done` клієнт отримує рівно ці чотири події в цьому порядку, а наступний `receive_json` кидає `WebSocketDisconnect` з кодом 1000"
    - "Тест: сценарій з `failed` так само закриває з'єднання з 1000, а подія містить `error`"
    - "Тест: `{\"type\": \"ping\"}` посеред стріму дає `{\"type\": \"pong\"}`; `{\"type\": \"subscribe\"}` і рядок не-JSON дають подію `error`, після чого стрім триває"
    - "Тест: клієнт, що вийшов посеред стріму, не лишає незакритого джерела: `finally` fake-генератора виконався (прапорець `closed` у fake-хабі)"
    - "Події серіалізуються через `model_dump_json()`; `send_json` з моделлю в коді немає"
    - "`uv run mypy src` і `uv run ruff check` без помилок"
  verify: "cd capstone && uv run pytest tests/test_ws.py -q"

- id: p2
