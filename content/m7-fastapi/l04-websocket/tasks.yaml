  title: "Хаб подій: кілька вкладок, пізній глядач і HTML-клієнт"
  prompt: |
    Доведіть хаб подій до стану, коли його можна підключити до воркера з m7-l03.

    - Воркер (m7-l03) публікує в хаб `Queued` при постановці, `Running(page, total)` після кожної сторінки,
      `Done` або `Failed` наприкінці.
